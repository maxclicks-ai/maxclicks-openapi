  /events:
    get:
      tags: [Events]
      summary: List events
      description: >-
        Lists only ready business events for one event schema. Results are ordered by occurredAt
        descending, then id descending. The time filter is inclusive from and exclusive to; defaults
        are the seven days before now. A range wider than 90 days is clamped with a warning. Uses
        cursor pagination: no offset and no totalCount. Pending, failed, and outcome_unknown
        acceptances are absent; use events.status to inspect them. Invalid times return 400
        invalid_time_range; malformed cursors return 400 invalid_cursor. Events are read from the
        operational event store, not the analytics archive.
      operationId: events.list
      parameters:
        - name: schema
          in: query
          required: true
          description: The event schema id or slug.
          schema: { type: string }
        - name: from
          in: query
          required: false
          description: Start of the time range (ISO 8601). Defaults to 7 days before `to`.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          description: End of the time range (ISO 8601). Defaults to now.
          schema: { type: string, format: date-time }
        - name: cursor
          in: query
          required: false
          description: Opaque cursor from a previous page's `pagination.nextCursor`.
          schema: { type: string }
        - name: limit
          in: query
          required: false
          description: Page size. Defaults to 50, capped at 200.
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
      responses:
        '200':
          description: A cursor page of events.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Event' }
                  pagination: { $ref: '#/components/schemas/CursorPagination' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /events/{schema}:
    x-note: >-
      PATCH and DELETE /events/{id} are immutable guards that always return 405 events_immutable.
      They are not mutation operations. There is no GET /events/{id}; use GET
      /events/{schema}/{id}/status for an acceptance receipt.
    post:
      tags: [Events]
      summary: Fire an event
      description: >-
        Durably accepts one business event and returns 202 with its immutable acceptance receipt.
        Missing AI auto-fill fields are prepared asynchronously; readinessAtAcceptance is pending or
        ready. An accepted event is visible to event lists and consumers only once ready. Supply a
        stable eventId and retry the same normalized payload and occurredAt to recover the original
        receipt with isDuplicate=true. Changed input under the same eventId returns 409
        event_id_conflict; erased occurrences return 409 event_erased. Idempotency-Key is not used.
        The normalized event input is limited to 256 KiB. occurredAt must be within the previous 366
        days or five minutes into the future. contactId and objectId are optional, mutually
        exclusive explicit subjects in this space. Event admission has separate rate, backlog, and
        receipt-storage limits in addition to the API write bucket.
      operationId: events.fire
      parameters:
        - name: schema
          in: path
          required: true
          description: The event schema id or slug.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventInput' }
            example:
              eventId: order_1042_paid
              amount: 42
      responses:
        '202':
          description: Durable event acceptance receipt; inspect readiness separately.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/FireResult' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"
  /events/{schema}/batch:
    parameters:
      - { $ref: '#/components/parameters/SchemaParam' }
    post:
      tags: [Events]
      summary: Fire a batch of events
      description: >-
        Accepts 1–500 events of one schema. With onError=continue (default), each event commits
        independently; inspect every result, including failures, even on HTTP 200. Accepted items
        include their immutable receipt. Admission failures include retryAfterMilliseconds. With
        onError=abort, a validation or admission failure rolls back new acceptances in that
        transaction, marks earlier accepted results rolled_back, and returns HTTP 422 with
        data.results, data.summary, and data.failedIndex. Later items are not attempted. Existing
        receipts encountered as duplicates remain existing occurrences. A 422 abort response is a
        business-result data envelope, not the standard error envelope. Each item uses eventId
        deduplication; Idempotency-Key is not used. Individual events retain the 256 KiB and
        occurredAt limits, and the whole HTTP body remains limited to 10 MB.
      operationId: events.fireBatch
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventBatchRequest' }
            example:
              events:
                - eventId: order_1042_paid
                  amount: 42
              onError: continue
      responses:
        '200':
          description: Per-item results and a summary.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/BatchFireResult' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422':
          description: Batch aborted; earlier new acceptances were rolled back. Inspect data.results and
            data.failedIndex.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/BatchFireResult' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        "500":
          $ref: "#/components/responses/ServerError"

