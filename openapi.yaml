openapi: 3.1.0

info:
  title: maxclicks Public API
  version: 1.0.0
  summary: The official REST API for the maxclicks email, CRM, and automation platform.
  description: >
    The maxclicks Public API v1. Manage contacts and objects, fire events, send
    templates, manage webhooks, trigger workflows, and submit forms.


    All authenticated endpoints use a bearer API key. Successful responses are
    wrapped in a `data` envelope (with an optional `warnings` array); list
    endpoints add a `pagination` block. Errors use a Stripe-style
    `{ error: { type, code, message } }` envelope.


    Rate limits are enforced per API key: 100 reads per second and 25 writes per
    second. Exceeding a limit returns `429` with a `Retry-After` header.
  contact:
    name: maxclicks
    url: https://maxclicks.ai
    email: info@maxclicks.ai
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

externalDocs:
  description: Developer documentation
  url: https://docs.maxclicks.ai

servers:
  - url: https://api.maxclicks.ai/v1
    description: Production
  - url: https://api-stage.maxclicks.ai/v1
    description: Staging

security:
  - bearerAuth: []

tags:
  - name: Meta
    description: Identify the calling API key.
  - name: Schemas
    description: Read the space's schemas (contact, object, event).
  - name: Attributes
    description: Read a schema's attributes.
  - name: Records
    description: Create, read, update, and delete contact and object records.
  - name: Suppressions
    description: Manage the email do-not-contact list. Requires an admin key.
  - name: Events
    description: Fire trigger events and read them back.
  - name: Templates
    description: Send stored message templates.
  - name: Webhooks
    description: Manage outgoing webhooks.
  - name: Workflows
    description: Trigger workflows through incoming-webhook steps.
  - name: Forms
    description: Public form submission and double opt-in confirmation.
  - name: Emails
    description: Public email recipient actions.

paths:
  /me:
    get:
      tags: [Meta]
      summary: Identify the calling API key
      description: >
        Returns the key metadata, its owning user, the bound space (if any), and
        the caller's role. Works for space-unbound keys, in which case `space`
        and `role` are null.
      operationId: meta.me
      responses:
        '200':
          description: The identity of the calling key.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Me' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /schemas:
    get:
      tags: [Schemas]
      summary: List schemas
      description: Lists the space's schemas, optionally filtered by type.
      operationId: schemas.list
      parameters:
        - name: type
          in: query
          description: Filter by one or more schema types. Repeat the parameter to pass several.
          required: false
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: '#/components/schemas/SchemaType' }
        - { $ref: '#/components/parameters/LimitParam' }
        - { $ref: '#/components/parameters/OffsetParam' }
      responses:
        '200':
          description: A page of schemas.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Schema' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /schemas/{schema}:
    parameters:
      - { $ref: '#/components/parameters/SchemaParam' }
    get:
      tags: [Schemas]
      summary: Get a schema
      description: Fetches a single schema by id or slug.
      operationId: schemas.get
      responses:
        '200':
          description: The schema.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Schema' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /schemas/{schema}/attributes:
    parameters:
      - { $ref: '#/components/parameters/SchemaParam' }
    get:
      tags: [Attributes]
      summary: List attributes
      description: Lists a schema's attributes, base attributes first, then custom attributes.
      operationId: attributes.list
      parameters:
        - { $ref: '#/components/parameters/LimitParam' }
        - { $ref: '#/components/parameters/OffsetParam' }
      responses:
        '200':
          description: A page of attributes.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Attribute' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /schemas/{schema}/attributes/{attribute}:
    parameters:
      - { $ref: '#/components/parameters/SchemaParam' }
      - name: attribute
        in: path
        required: true
        description: Attribute selector. Accepts `base:<key>`, a custom attribute id, or a raw key.
        schema: { type: string }
    get:
      tags: [Attributes]
      summary: Get an attribute
      operationId: attributes.get
      responses:
        '200':
          description: The attribute.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Attribute' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /schemas/{schema}/records:
    parameters:
      - { $ref: '#/components/parameters/SchemaParam' }
    get:
      tags: [Records]
      summary: List records
      description: Lists records in a contact or object schema, oldest first.
      operationId: records.list
      parameters:
        - { $ref: '#/components/parameters/LimitParam' }
        - { $ref: '#/components/parameters/OffsetParam' }
      responses:
        '200':
          description: A page of records.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Record' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Records]
      summary: Create a record
      description: >
        Strictly creates one contact or object record (never updates an existing
        one). Any `id` in the body is ignored. `source` is forced to `api`.
      operationId: records.create
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordInput' }
      responses:
        '201':
          description: The created record.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /schemas/{schema}/records/upsert:
    parameters:
      - { $ref: '#/components/parameters/SchemaParam' }
    post:
      tags: [Records]
      summary: Upsert a record
      description: >
        Creates or updates a record by identity. Contact match cascade is
        id, then userId, then email, then phone; object match is id, then
        externalId. Per-field identifier conflicts are reverted and reported in
        `warnings`. Returns 201 when created, 200 when updated.
      operationId: records.upsert
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordInput' }
      responses:
        '200':
          description: The updated record.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordEnvelope' }
        '201':
          description: The created record.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /schemas/{schema}/records/{id}:
    parameters:
      - { $ref: '#/components/parameters/SchemaParam' }
      - { $ref: '#/components/parameters/RecordIdParam' }
    get:
      tags: [Records]
      summary: Get a record
      operationId: records.get
      responses:
        '200':
          description: The record.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }
    patch:
      tags: [Records]
      summary: Update a record
      description: Partially updates a record. An explicit null clears a nullable field.
      operationId: records.update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordInput' }
      responses:
        '200':
          description: The updated record.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [Records]
      summary: Delete a record
      operationId: records.delete
      responses:
        '200':
          description: The record was deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletedEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /schemas/{schema}/records/{id}/audit-trail:
    parameters:
      - { $ref: '#/components/parameters/SchemaParam' }
      - { $ref: '#/components/parameters/RecordIdParam' }
    get:
      tags: [Records]
      summary: List a contact's audit trail
      description: Lists the consent and communication audit trail for a contact, newest first.
      operationId: records.auditTrail
      parameters:
        - name: channel
          in: query
          required: false
          description: Filter by communication channel.
          schema: { $ref: '#/components/schemas/CommunicationChannel' }
        - { $ref: '#/components/parameters/LimitParam' }
        - { $ref: '#/components/parameters/OffsetParam' }
      responses:
        '200':
          description: A page of audit-trail entries.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AuditTrailEntry' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /contacts/suppressions:
    post:
      tags: [Suppressions]
      summary: Create a suppression
      description: Suppresses an email identifier for the space. Requires an admin key.
      operationId: suppressions.create
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SuppressionInput' }
      responses:
        '201':
          description: The created suppression.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Suppression' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /contacts/suppressions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The suppression id.
        schema: { type: string }
    delete:
      tags: [Suppressions]
      summary: Delete a suppression
      description: Removes a suppression, re-allowing communication to that identifier. Requires an admin key.
      operationId: suppressions.delete
      responses:
        '200':
          description: The suppression was removed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletedEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /events/{schema}:
    post:
      tags: [Events]
      summary: Fire an event
      description: >
        Fires a single event of the given event schema. Asynchronous fire and
        forget: the event is handed to the ingest pipeline and 202 is returned
        with the accepted count. The body is the flat event input.
      operationId: events.fire
      parameters:
        - name: schema
          in: path
          required: true
          description: The event schema id or slug.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventInput' }
      responses:
        '202':
          description: The event was accepted by the ingest pipeline.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/FireResult' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/IngestUnavailable' }
    get:
      tags: [Events]
      summary: Get an event
      description: Fetches one previously-fired event by its platform id.
      operationId: events.get
      parameters:
        - name: schema
          in: path
          required: true
          description: The event's platform id.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The event.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Event' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /events/{schema}/batch:
    parameters:
      - { $ref: '#/components/parameters/SchemaParam' }
    post:
      tags: [Events]
      summary: Fire a batch of events
      description: >
        Fires up to 500 events of one schema. With `onError: continue` (the
        default) every valid item is queued and 200 is returned. With
        `onError: abort` the batch stops at the first invalid item and returns
        422 with `failedIndex`.
      operationId: events.fireBatch
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventBatchRequest' }
      responses:
        '200':
          description: Per-item results and a summary.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/BatchFireResult' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '422':
          description: The batch aborted on the first invalid item.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/BatchFireResult' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/IngestUnavailable' }

  /templates/{templateId}/send:
    parameters:
      - name: templateId
        in: path
        required: true
        description: The template id.
        schema: { type: string, format: uuid }
    post:
      tags: [Templates]
      summary: Send a template
      description: >
        Renders and sends a template to the recipient resolved from `data`. The
        send is synchronous. The response body is an empty object; any warnings
        are returned in the `maxclicks-Warning-Message` response header.
      operationId: templates.send
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TemplateSendRequest' }
      responses:
        '200':
          description: The send was processed.
          headers:
            maxclicks-Warning-Message:
              description: URL-encoded, newline-joined warnings, when any were produced.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                description: An empty object.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /webhooks:
    get:
      tags: [Webhooks]
      summary: List webhooks
      operationId: webhooks.list
      parameters:
        - { $ref: '#/components/parameters/LimitParam' }
        - { $ref: '#/components/parameters/OffsetParam' }
      responses:
        '200':
          description: A page of webhooks.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Webhook' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Webhooks]
      summary: Create a webhook
      description: >
        Creates a webhook. The response includes `signatureVerificationSecret`,
        which is shown here and on rotate-secret only. Save it immediately.
      operationId: webhooks.create
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookCreate' }
      responses:
        '201':
          description: The created webhook, including its signing secret.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/WebhookWithSecret' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /webhooks/{id}:
    parameters:
      - { $ref: '#/components/parameters/WebhookIdParam' }
    get:
      tags: [Webhooks]
      summary: Get a webhook
      operationId: webhooks.get
      responses:
        '200':
          description: The webhook.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Webhook' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }
    patch:
      tags: [Webhooks]
      summary: Update a webhook
      description: Updates url, email event types, condition, and/or status. Trigger and schema are not updatable.
      operationId: webhooks.update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookUpdate' }
      responses:
        '200':
          description: The updated webhook.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Webhook' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [Webhooks]
      summary: Delete a webhook
      operationId: webhooks.delete
      responses:
        '200':
          description: The webhook was deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletedEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /webhooks/{id}/rotate-secret:
    parameters:
      - { $ref: '#/components/parameters/WebhookIdParam' }
    post:
      tags: [Webhooks]
      summary: Rotate a webhook secret
      description: Generates a new signing secret and returns it. The old secret stops verifying immediately.
      operationId: webhooks.rotateSecret
      responses:
        '200':
          description: The new signing secret.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/RotatedWebhookSecret' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /workflows/{workflowStepReference}:
    parameters:
      - name: workflowStepReference
        in: path
        required: true
        description: The incoming-webhook step's reference id.
        schema: { type: string }
    post:
      tags: [Workflows]
      summary: Trigger a workflow
      description: >
        Starts a workflow run from an incoming-webhook step. The body is
        arbitrary JSON validated server-side against the step's configured JSON
        schema. On success returns an empty object. Note: failures from the
        workflow handler are returned as `text/plain`, while authentication
        failures use the JSON error envelope.
      operationId: workflows.trigger
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Per-workflow-step payload, validated against the step's JSON schema.
              additionalProperties: true
      responses:
        '200':
          description: The workflow run was started.
          content:
            application/json:
              schema:
                type: object
                description: An empty object.
        '400':
          description: The body failed the step's JSON schema, or the schema is invalid.
          content:
            text/plain:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No matching, published incoming-webhook step for this reference.
          content:
            text/plain:
              schema: { type: string }
        '500':
          description: Server error.
          content:
            text/plain:
              schema: { type: string }

  /forms/{formId}/submit:
    parameters:
      - { $ref: '#/components/parameters/FormIdParam' }
    post:
      tags: [Forms]
      summary: Submit a form
      description: >
        Public, unauthenticated form submission. Validates required fields,
        CAPTCHA, and consent, then upserts the contact or (for double opt-in)
        stores a pending record and emails a confirmation link.
      operationId: forms.submit
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FormSubmission' }
      responses:
        '200':
          description: The submission was accepted.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/FormSubmissionResult' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /forms/{formId}/confirm/{token}:
    parameters:
      - { $ref: '#/components/parameters/FormIdParam' }
      - name: token
        in: path
        required: true
        description: The single-use double opt-in token from the confirmation email.
        schema: { type: string }
    get:
      tags: [Forms]
      summary: Confirm a double opt-in
      description: >
        Public browser navigation target for the double opt-in email link.
        Redeems the token, upserts the confirmed contact, and always redirects
        (302) to the hosted result page.
      operationId: forms.confirmDoubleOptIn
      security: []
      responses:
        '302':
          description: Redirect to the hosted confirmation result page.
          headers:
            Location:
              description: The result page URL.
              schema: { type: string, format: uri }

  /emails/{emailId}/unsubscribe:
    parameters:
      - name: emailId
        in: path
        required: true
        description: The id of the sent email.
        schema: { type: string }
    post:
      tags: [Emails]
      summary: One-click unsubscribe
      description: >
        Public RFC 8058 one-click unsubscribe target. Unsubscribes the linked
        contact from a topic or the whole email channel, then redirects (302) to
        the hosted result page.
      operationId: emails.unsubscribeOneClick
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [List-Unsubscribe]
              properties:
                List-Unsubscribe:
                  type: string
                  const: One-Click
      responses:
        '302':
          description: Redirect to the hosted unsubscribe result page.
          headers:
            Location:
              description: The result page URL.
              schema: { type: string, format: uri }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Your API key sent as a bearer token in the `Authorization` header:
        `Authorization: Bearer <api_key>`.

  parameters:
    LimitParam:
      name: limit
      in: query
      required: false
      description: Page size. Clamped to 1..200 with a warning if out of range.
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 200
    OffsetParam:
      name: offset
      in: query
      required: false
      description: Rows to skip. Clamped to 0..10000 with a warning if out of range.
      schema:
        type: integer
        default: 0
        minimum: 0
        maximum: 10000
    SchemaParam:
      name: schema
      in: path
      required: true
      description: A schema id or slug.
      schema: { type: string }
    RecordIdParam:
      name: id
      in: path
      required: true
      description: The record's platform id.
      schema: { type: string, format: uuid }
    WebhookIdParam:
      name: id
      in: path
      required: true
      description: The webhook id.
      schema: { type: string, format: uuid }
    FormIdParam:
      name: formId
      in: path
      required: true
      description: The form id.
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: The request was malformed or failed validation.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: The API key is missing or invalid.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: The key lacks permission, or the space is out of scope.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: The referenced resource was not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: The write conflicts with an existing resource.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: The rate limit was exceeded.
      headers:
        Retry-After:
          description: When to retry, as an HTTP date.
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    IngestUnavailable:
      description: The event ingest pipeline is unavailable.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServerError:
      description: The API failed to process a valid request.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [type, code, message]
          properties:
            type:
              type: string
              enum: [invalid_request_error, api_error]
            code:
              type: [string, 'null']
              description: A stable machine-readable code, or null.
            message:
              type: string

    Warnings:
      type: array
      description: Non-fatal warnings accumulated while processing the request.
      items: { type: string }

    Pagination:
      type: object
      required: [limit, offset, totalCount, hasMore]
      properties:
        limit: { type: integer }
        offset: { type: integer }
        totalCount: { type: integer }
        hasMore: { type: boolean }

    Deleted:
      type: object
      required: [id, deleted]
      properties:
        id: { type: string }
        deleted: { type: boolean, const: true }

    DeletedEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Deleted' }
        warnings: { $ref: '#/components/schemas/Warnings' }

    RecordEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Record' }
        warnings: { $ref: '#/components/schemas/Warnings' }

    SchemaType:
      type: string
      enum: [contact, object, event]

    ContactSource:
      type: string
      enum: [import, api, form, manual, workflow, integration]

    CommunicationChannel:
      type: string
      enum: [email]

    SuppressionReason:
      type: string
      enum: [manual, legal]

    RoleName:
      type: string
      enum: [admin, non-paid admin, member]

    Me:
      type: object
      required: [apiKey, user, space, role]
      properties:
        apiKey:
          type: object
          required: [id, name, keyDisplay, createdAt]
          properties:
            id: { type: string }
            name: { type: [string, 'null'] }
            keyDisplay: { type: string }
            createdAt: { type: string, format: date-time }
        user:
          type: object
          required: [id, email, name]
          properties:
            id: { type: string }
            email: { type: string, format: email }
            name: { type: [string, 'null'] }
        space:
          type: [object, 'null']
          properties:
            id: { type: string }
            slug: { type: string }
            name: { type: string }
        role:
          type: [object, 'null']
          properties:
            name: { $ref: '#/components/schemas/RoleName' }
            label: { type: string }
            description: { type: string }

    Schema:
      type: object
      required:
        [id, type, slug, name, namePlural, description, integrationVendorName, attributeCount, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/SchemaType' }
        slug: { type: string }
        name: { type: string }
        namePlural: { type: string }
        description: { type: [string, 'null'] }
        integrationVendorName: { type: [string, 'null'] }
        attributeCount:
          type: integer
          description: Count of custom attribute rows only (base attributes excluded).
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AttributeDefinition:
      type: object
      description: >
        A stored or evaluated attribute definition. The `type` discriminates the
        shape. Stored types include string, number, decimal, boolean, date time,
        date only, time only, url, email, phone, json, string array, object, and
        object array. `evaluated` attributes are computed and never stored; their
        generated expression is never returned. Additional properties vary by
        type and sub-format.
      required: [type]
      properties:
        type: { type: string }
      additionalProperties: true

    Attribute:
      type: object
      required: [id, key, label, description, sequence, definition, integrationVendorName, createdAt, updatedAt]
      properties:
        id:
          type: string
          description: A custom attribute id, or `base:<key>` for platform base attributes.
        key: { type: string }
        label: { type: string }
        description: { type: [string, 'null'] }
        sequence:
          type: [string, 'null']
          description: Ordering value for custom attributes; null for base attributes.
        definition: { $ref: '#/components/schemas/AttributeDefinition' }
        integrationVendorName: { type: [string, 'null'] }
        createdAt: { type: [string, 'null'], format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }

    EmailStatistics:
      type: object
      required: [sent, delivered, bounced, complained, unsubscribed, uniqueOpens, uniqueClicks]
      properties:
        sent: { type: integer }
        delivered: { type: integer }
        bounced: { type: integer }
        complained: { type: integer }
        unsubscribed: { type: integer }
        uniqueOpens: { type: integer }
        uniqueClicks: { type: integer }

    ContactRecord:
      type: object
      description: A contact record. Custom attribute values are spread onto the top level.
      required:
        - id
        - schemaId
        - schemaSlug
        - source
        - fullName
        - firstName
        - lastName
        - avatarUrl
        - userId
        - email
        - phone
        - subscriptions
        - topicIds
        - notes
        - tags
        - emailStatistics
        - createdAt
        - updatedAt
      properties:
        id: { type: string, format: uuid }
        schemaId: { type: string, format: uuid }
        schemaSlug: { type: string }
        source: { $ref: '#/components/schemas/ContactSource' }
        fullName: { type: [string, 'null'] }
        firstName: { type: [string, 'null'] }
        lastName: { type: [string, 'null'] }
        avatarUrl: { type: [string, 'null'] }
        userId: { type: [string, 'null'] }
        email: { type: [string, 'null'], format: email }
        phone: { type: [string, 'null'] }
        subscriptions:
          type: array
          items: { $ref: '#/components/schemas/CommunicationChannel' }
        topicIds:
          type: array
          items: { type: string }
        notes: { type: [string, 'null'] }
        tags:
          type: array
          items: { type: string }
        emailStatistics:
          oneOf:
            - { $ref: '#/components/schemas/EmailStatistics' }
            - { type: 'null' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      additionalProperties: true

    ObjectRecord:
      type: object
      description: An object record. Custom attribute values are spread onto the top level.
      required: [id, schemaId, schemaSlug, externalId, notes, tags, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        schemaId: { type: string, format: uuid }
        schemaSlug: { type: string }
        externalId: { type: [string, 'null'] }
        notes: { type: [string, 'null'] }
        tags:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      additionalProperties: true

    Record:
      description: A contact or object record.
      oneOf:
        - { $ref: '#/components/schemas/ContactRecord' }
        - { $ref: '#/components/schemas/ObjectRecord' }

    RecordInput:
      type: object
      description: >
        Input for creating, upserting, or updating a record. All fields are
        optional. For a contact schema the contact fields apply; for an object
        schema the object fields apply. Custom attribute keys are passed at the
        top level.
      properties:
        id: { type: string }
        fullName: { type: [string, 'null'] }
        firstName: { type: [string, 'null'] }
        lastName: { type: [string, 'null'] }
        avatarUrl: { type: [string, 'null'] }
        userId: { type: [string, 'null'] }
        email: { type: [string, 'null'], format: email }
        phone: { type: [string, 'null'] }
        subscriptions:
          type: array
          items: { $ref: '#/components/schemas/CommunicationChannel' }
        topicIds:
          type: array
          items: { type: string }
        externalId: { type: [string, 'null'] }
        notes: { type: [string, 'null'] }
        tags:
          type: array
          items: { type: string }
      additionalProperties: true

    AuditTrailEntry:
      type: object
      required:
        - id
        - createdAt
        - communicationChannel
        - communicationTopicIds
        - eventType
        - state
        - optInLevel
        - actorType
        - actorIdentifier
        - context
      properties:
        id: { type: string }
        createdAt: { type: string, format: date-time }
        communicationChannel: { $ref: '#/components/schemas/CommunicationChannel' }
        communicationTopicIds:
          type: array
          items: { type: string }
        eventType:
          type: string
          enum:
            - email_verification_sent
            - email_verified
            - phone_verification_sent
            - phone_verified
            - subscribed
            - unsubscribed
            - topics_added
            - topics_removed
            - suppressed
            - unsuppressed
        state:
          type: [string, 'null']
          enum: [subscribed, not_subscribed, unsubscribed, pending, invalid, redacted, null]
        optInLevel:
          type: [string, 'null']
          enum: [single, double, unknown, null]
        actorType:
          type: string
          enum: [contact, admin, system, api]
        actorIdentifier: { type: [string, 'null'] }
        context:
          description: Raw JSON context (consent text/version, IP, user agent, source URL, form id, timestamp).

    SuppressionInput:
      type: object
      required: [identifier, reason]
      properties:
        identifier:
          type: string
          format: email
          description: The email address to suppress.
        reason: { $ref: '#/components/schemas/SuppressionReason' }
        notes: { type: [string, 'null'] }

    Suppression:
      type: object
      required: [id, createdAt, communicationChannel, reason, notes, affectedContactCount]
      properties:
        id: { type: string }
        createdAt: { type: string, format: date-time }
        communicationChannel: { $ref: '#/components/schemas/CommunicationChannel' }
        reason: { $ref: '#/components/schemas/SuppressionReason' }
        notes: { type: [string, 'null'] }
        affectedContactCount:
          type: integer
          description: Contacts in the space whose email matched the suppressed identifier.

    EventInput:
      type: object
      description: A flat event input. Any `id` is ignored on fire. Custom attribute keys are passed at the top level.
      properties:
        eventId:
          type: [string, 'null']
          description: Deduplication key.
        occurredAt:
          type: string
          format: date-time
          description: When the event actually happened.
      additionalProperties: true

    FireResult:
      type: object
      required: [accepted]
      properties:
        accepted:
          type: integer
          description: Number of events accepted by the ingest pipeline.

    BatchFireItemResult:
      type: object
      required: [index, status]
      properties:
        index: { type: integer }
        status:
          type: string
          enum: [accepted, failed]
        error:
          type: object
          required: [type, code, message]
          properties:
            type: { type: string }
            code: { type: [string, 'null'] }
            message: { type: string }

    BatchFireResult:
      type: object
      required: [results, summary]
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/BatchFireItemResult' }
        summary:
          type: object
          required: [accepted, failed]
          properties:
            accepted: { type: integer }
            failed: { type: integer }
        failedIndex:
          type: integer
          description: Present only on an abort response, pointing at the first invalid item.

    EventBatchRequest:
      type: object
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/EventInput' }
        onError:
          type: string
          enum: [continue, abort]
          default: continue

    Event:
      type: object
      description: A fired event. Custom attribute values are spread onto the top level.
      required: [id, schemaId, schemaSlug, eventId, createdAt]
      properties:
        id: { type: string, format: uuid }
        schemaId: { type: string, format: uuid }
        schemaSlug: { type: string }
        eventId: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
      additionalProperties: true

    TemplateSendRequest:
      type: object
      required: [data]
      properties:
        data:
          type: object
          description: Payload keyed by the template's expected data-representation properties.
          additionalProperties: true

    WebhookTrigger:
      type: string
      enum:
        - contact upserted
        - contact deleted
        - object upserted
        - object deleted
        - event fired
        - email event

    EmailEventType:
      type: string
      enum:
        - scheduled
        - sending failed
        - sent
        - rejected
        - unsubscribed
        - bounced
        - complained
        - delivered
        - opened
        - clicked
        - delivery delayed

    WebhookStatus:
      type: string
      enum: [live, paused, circuit breaker]

    WebhookCondition:
      oneOf:
        - type: object
          required: [type]
          properties:
            type: { type: string, const: none }
        - type: object
          required: [type, segmentId]
          properties:
            type: { type: string, const: segment }
            segmentId: { type: string }
        - type: object
          required: [type, description]
          properties:
            type: { type: string, const: custom filter }
            description: { type: string }

    WebhookConditionInput:
      oneOf:
        - type: object
          required: [type]
          properties:
            type: { type: string, const: none }
        - type: object
          required: [type, segmentId]
          properties:
            type: { type: string, const: segment }
            segmentId: { type: string }

    Webhook:
      type: object
      required:
        - id
        - createdAt
        - updatedAt
        - url
        - trigger
        - emailEventTypes
        - schemaId
        - condition
        - status
        - totalCalls
        - failedCalls
        - failedCallsInARow
        - lastCalledAt
        - lastCallErrorMessage
        - integrationVendorName
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        url: { type: string, format: uri }
        trigger: { $ref: '#/components/schemas/WebhookTrigger' }
        emailEventTypes:
          type: array
          items: { $ref: '#/components/schemas/EmailEventType' }
        schemaId: { type: [string, 'null'] }
        condition: { $ref: '#/components/schemas/WebhookCondition' }
        status: { $ref: '#/components/schemas/WebhookStatus' }
        totalCalls: { type: integer }
        failedCalls: { type: integer }
        failedCallsInARow: { type: integer }
        lastCalledAt: { type: [string, 'null'], format: date-time }
        lastCallErrorMessage: { type: [string, 'null'] }
        integrationVendorName:
          type: [string, 'null']
          description: Non-null means the webhook is integration-owned and cannot be updated, deleted, or rotated.

    WebhookWithSecret:
      allOf:
        - { $ref: '#/components/schemas/Webhook' }
        - type: object
          required: [signatureVerificationSecret]
          properties:
            signatureVerificationSecret: { type: string }

    WebhookCreate:
      type: object
      required: [url, trigger]
      properties:
        url: { type: string, format: uri }
        trigger: { $ref: '#/components/schemas/WebhookTrigger' }
        emailEventTypes:
          type: array
          description: Required and non-empty only when trigger is `email event`.
          items: { $ref: '#/components/schemas/EmailEventType' }
        schemaId:
          type: [string, 'null']
          description: A schema id or slug. Required for every trigger except `email event`.
        condition:
          $ref: '#/components/schemas/WebhookConditionInput'

    WebhookUpdate:
      type: object
      description: At least one field must be provided. Trigger and schema are not updatable.
      properties:
        url: { type: string, format: uri }
        emailEventTypes:
          type: array
          items: { $ref: '#/components/schemas/EmailEventType' }
        condition: { $ref: '#/components/schemas/WebhookConditionInput' }
        status:
          type: string
          enum: [live, paused]

    RotatedWebhookSecret:
      type: object
      required: [id, signatureVerificationSecret, updatedAt]
      properties:
        id: { type: string }
        signatureVerificationSecret: { type: string }
        updatedAt: { type: string, format: date-time }

    FormContactInput:
      type: object
      description: Flat contact input for the form's contact schema. Custom attribute keys are passed at the top level.
      properties:
        id: { type: [string, 'null'] }
        fullName: { type: [string, 'null'] }
        firstName: { type: [string, 'null'] }
        lastName: { type: [string, 'null'] }
        avatarUrl: { type: [string, 'null'] }
        userId: { type: [string, 'null'] }
        email: { type: [string, 'null'], format: email }
        phone: { type: [string, 'null'] }
        notes: { type: [string, 'null'] }
        tags:
          type: [array, 'null']
          items: { type: string }
      additionalProperties: true

    FormSubmission:
      type: object
      required: [contact]
      properties:
        contact: { $ref: '#/components/schemas/FormContactInput' }
        emailMarketingConsent: { type: [boolean, 'null'] }
        captchaToken: { type: [string, 'null'] }

    FormSubmissionResult:
      oneOf:
        - type: object
          required: [contactId]
          properties:
            contactId: { type: string }
        - type: object
          required: [status]
          properties:
            status: { type: string, const: verification_pending }
