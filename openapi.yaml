        '500': { $ref: '#/components/responses/ServerError' }

  /events:
    get:
      tags: [Events]
      summary: List events
      description: >
        Cursor-paginated event history for one event schema, newest first, read
        through the ClickHouse-backed archive (so it sees every event ever fired,
        not just ones that triggered backend processing). `from`/`to` default to
        the 7 days before now when omitted; a wider span than
        `config.publicApi.maximumEventListRangeDays` (90 days) is silently clamped
        with a warning, not rejected. This endpoint uses the distinct cursor
        pagination envelope, not the offset envelope used elsewhere in v1: there
        is no `offset` parameter and no `totalCount`. Errors: `schema_not_found`,
        `invalid_cursor`, `invalid_time_range`, `event_archive_unavailable` (502).
      operationId: events.list
      parameters:
        - name: schema
          in: query
          required: true
          description: The event schema id or slug.
          schema: { type: string }
        - name: from
          in: query
          required: false
          description: Start of the time range (ISO 8601). Defaults to 7 days before `to`.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          description: End of the time range (ISO 8601). Defaults to now.
          schema: { type: string, format: date-time }
        - name: cursor
          in: query
          required: false
          description: Opaque cursor from a previous page's `pagination.nextCursor`.
          schema: { type: string }
        - name: limit
          in: query
          required: false
          description: Page size. Defaults to 50, capped at 200.
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
      responses:
        '200':
          description: A cursor page of events.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Event' }
                  pagination: { $ref: '#/components/schemas/CursorPagination' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }
        '502': { $ref: '#/components/responses/IngestUnavailable' }

  /events/{schema}:
    x-note: >
      OpenAPI templates `/events/{schema}` (fire) and `/events/{id}` (get one) as the same path
      shape, so this path item merges both under one templated path with `post` and `get`,
      mirroring how the server dispatches them by method. The wire URLs are unchanged.
      `PATCH`/`DELETE /events/{id}` always return `405 events_immutable` ("Events are immutable.
      Fire a new event instead."), a deliberate guard, not a real operation, and not modeled here.
    post:
      tags: [Events]
      summary: Fire an event
      description: >
        Fires a single event of the given event schema. Asynchronous fire and
        forget: the event is handed to the ingest pipeline and 202 is returned
        with the accepted count. The body is the flat event input. Not
        Idempotency-Key aware; dedupe with your own `eventId` instead. Errors:
        `schema_not_found`, `ingest_unavailable` (502).
      operationId: events.fire
      parameters:
        - name: schema
          in: path
          required: true
          description: The event schema id or slug.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventInput' }
      responses:
        '202':
          description: The event was accepted by the ingest pipeline.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/FireResult' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/IngestUnavailable' }
    get:
      tags: [Events]
      summary: Get an event
      description: >
        Fetches one previously-fired event by its platform id. Falls back to the
        ClickHouse-backed archive when there is no operational row (an event whose
        schema was never demanded is archived but has no operational row).
      operationId: events.get
      parameters:
        - name: schema
          in: path
          required: true
          description: The event's platform id.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The event.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Event' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }
        '502': { $ref: '#/components/responses/IngestUnavailable' }

  /events/{schema}/batch:
    parameters:
      - { $ref: '#/components/parameters/SchemaParam' }
    post:
      tags: [Events]
      summary: Fire a batch of events
      description: >
        Fires up to 500 events of one schema. With `onError: continue` (the
        default) every item is validated, the whole valid subset is handed to the
        ingest pipeline in one call, and 200 is returned with per-item results;
        if that single ingest call itself fails, the whole request fails `502
        ingest_unavailable` rather than a partial success. With `onError: abort`
        the batch stops at the first invalid item, ingests nothing, and returns
        422 with `failedIndex`. Not Idempotency-Key aware.
      operationId: events.fireBatch
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventBatchRequest' }
      responses:
        '200':
          description: Per-item results and a summary.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/BatchFireResult' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422':
          description: The batch aborted on the first invalid item.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/BatchFireResult' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/IngestUnavailable' }

  /domains:
    get:
      tags: [Domains]
      summary: List domains
      description: Items omit `records` (unlike get/create/verify); call `domains.get` for DNS records.
      operationId: domains.list
      parameters:
        - { $ref: '#/components/parameters/LimitParam' }
        - { $ref: '#/components/parameters/OffsetParam' }
      responses:
        '200':
          description: A page of domains.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Domain' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Domains]
      summary: Add a domain
      description: >
        Synchronously provisions AWS SES resources and returns the DNS records to
