  /contacts/suppressions:
    get:
      tags: [Suppressions]
      summary: List suppressions
      description: >
        Lists suppressions for the caller's space, newest first. Includes global
        suppressions (not space-scoped) alongside space-scoped ones, since both
        block sends to the caller's contacts. Requires an admin key.
      operationId: suppressions.list
      parameters:
        - name: identifier
          in: query
          required: false
          description: Filter to the suppression(s) for one email address.
          schema: { type: string, format: email }
        - { $ref: '#/components/parameters/LimitParam' }
