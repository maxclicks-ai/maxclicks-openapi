openapi: 3.1.0

info:
  title: maxclicks Public API
  version: 1.1.0
  summary: The official REST API for the maxclicks email, CRM, and automation platform.
  description: >-
    The maxclicks Public API connects customer data to prepared audiences, emails, and journeys.
    Version 1.1.0 is served under /v1. Schemas, attributes, template content, broadcast content,
    domains, senders, topics, and keys are authored in the app. This specification documents 59
    functional operations; PATCH/DELETE /events/{id} are immutable guards that always return 405.


    Authenticated operations use a Bearer API key, or an OAuth 2.1 access token for a connection a
    user approved, and the owner's space permissions. An OAuth connection is further limited to the
    scopes its user granted. Results use data, optionally warnings and pagination. Standard failures use error.type/code/message and
    optional issues. Event batch abort is a 422 data result, and an unresolved idempotency
    persistence failure may omit error.type.


    Eighteen operations accept Idempotency-Key, as declared by their header parameter. Sixteen
    use the generic response cache: keep the same calling key, method, path, and body on retries.
    Recorded results include errors and webhook secrets. Completed opaque-key responses have a
    nominal 24-hour retention period; timed record keys have a separate admission window. Unresolved
    operations need reconciliation. Template send instead requires a durable send identity and
    retains its original message; it does not use the generic response-cache expiry or replay
    headers. Record deletion requires an explicit attempt key and returns current operation status,
    rather than a cached response. Event acceptance uses eventId, and event identity changes use operationId plus a
    per-alias revision.


    HTTP acceptance does not imply finished downstream work. Events return a durable receipt and
    have a separate readiness endpoint; record deletion returns a pollable operation status;
    workflow triggers create a run; broadcast sends schedule work. Use the resource reference for
    the exact inputs and outcome checks for each operation.


    API request limits are read=100/second, write=25/second, ai=10/minute per key. Event admission
    also has shared occurrence/backlog/receipt caps. Retry-After can be a delay in seconds or an
    HTTP date. Body size is limited to 10 MB; normalized event input is limited to 256 KiB. Offset
    traversal is capped at 10,000; ready events use cursors over a maximum 90-day query window.
  contact:
    name: maxclicks
    url: https://maxclicks.ai
    email: info@maxclicks.ai
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

externalDocs:
  description: Developer documentation
  url: https://docs.maxclicks.ai

servers:
  - url: https://api.maxclicks.ai/v1
    description: Production
  - url: https://api-stage.maxclicks.ai/v1
    description: Staging

security:
  - bearerAuth: []
  - oauth2: []

tags:
  - name: Meta
    description: Identify the calling API key.
  - name: Schemas
    description: Read the space's schemas (contact, object, event). Schema definitions are authored in the app.
  - name: Attributes
    description: Read a schema's attributes. Attributes are authored in the app.
  - name: Records
    description: Keep stored contact and object data current, inspect consent history, and track
      deletion to completion.
  - name: Suppressions
    description: Manage the email do-not-contact list. Requires an admin key.
  - name: Events
    description: Accept durable business events, inspect readiness, and bind anonymous source identities
      to contacts.
  - name: Domains
    description: Read sending domains and their DNS verification status. Domains are added and verified
      in the app.
  - name: Senders
    description: Read saved sender profiles configured in the app.
  - name: Topics
    description: Read communication topics configured in the app.
  - name: Segments
    description: Generate and manage AI-defined contact filters.
  - name: Broadcasts
    description: Schedule, send, and measure mass emails. Broadcasts are authored in the app.
  - name: Templates
    description: Send stored message templates. Templates are authored in the app.
  - name: Webhooks
    description: Manage outgoing webhooks.
  - name: Workflows
    description: Trigger published journeys, pause execution, and inspect runs and paged step history.
  - name: Forms
    description: Public form submission and double opt-in confirmation.
  - name: Emails
    description: Public email recipient actions.

paths:
  /me:
    get:
      tags: [Meta]
      summary: Identify the calling API key
      description: >
        Returns the key metadata, its owning user, the bound space (if any), and the caller's role.
        Works for space-unbound keys, in which case `space` and `role` are null. For an OAuth access
        token, `oauth` names the resource it was issued for, its granted scopes and its expiry.
      operationId: meta.me
      responses:
        '200':
          description: The identity of the calling key.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Me' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /schemas:
    get:
      tags: [Schemas]
      summary: List schemas
      description: Lists the space's schemas, optionally filtered by type.
      operationId: schemas.list
      parameters:
        - name: type
          in: query
          description: Filter by one or more schema types. Repeat the parameter to pass several.
          required: false
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: '#/components/schemas/SchemaType' }
        - { $ref: '#/components/parameters/LimitParam' }
        - { $ref: '#/components/parameters/OffsetParam' }
      responses:
        '200':
          description: A page of schemas.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Schema' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }
  /schemas/{schema}:
    parameters:
      - { $ref: '#/components/parameters/SchemaParam' }
    get:
      tags: [Schemas]
      summary: Get a schema
      description: Fetches a single schema by id or slug.
      operationId: schemas.get
      responses:
        '200':
          description: The schema.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Schema' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }
  /schemas/{schema}/attributes:
    parameters:
      - { $ref: '#/components/parameters/SchemaParam' }
    get:
      tags: [Attributes]
      summary: List attributes
      description: Lists base attributes first, then custom attributes. Base ids use base:<key> and have
        null sequence and timestamps. definition.type uses the documented stored/evaluated types;
        aggregate is definition.valueSource.type, not a top-level type. Only definitions with type
        other than evaluated and no valueSource are writable. Definition metadata can include
        auto-fill settings, aggregate source configuration, or evaluated target/reference
        descriptions; generated expressions are excluded. Record GET/list does not expand evaluated
        or aggregate values. Attribute authoring is available in the app, not through public v1.
      operationId: attributes.list
      parameters:
        - { $ref: '#/components/parameters/LimitParam' }
        - { $ref: '#/components/parameters/OffsetParam' }
      responses:
        '200':
          description: A page of attributes.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Attribute' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /schemas/{schema}/records:
    parameters:
      - { $ref: '#/components/parameters/SchemaParam' }
    get:
      tags: [Records]
      summary: List records
      description: Lists stored contact or object records, ordered by createdAt ascending then id
        ascending. Custom values are flattened at the top level alongside platform fields. Evaluated
        and aggregate attributes are not expanded. This endpoint accepts limit/offset only; it has
        no ad-hoc search, time filter, include, or trait-expansion query. Traversal is capped;
        pagination.hasMore can be false when totalCount exceeds the reachable window.
      operationId: records.list
      parameters:
        - { $ref: '#/components/parameters/LimitParam' }
        - { $ref: '#/components/parameters/OffsetParam' }
      responses:
        '200':
          description: A page of records.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Record' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Records]
      summary: Create a record
      description: >
        Strictly creates one contact or object record (never updates an existing one). Any `id` in
        the body is ignored. `source` is forced to `api`. Missing AI auto-fill values require
        a timed `Idempotency-Key` in the format `rpi1.<13-digit Unix milliseconds>.<UUIDv4>`.
        Generate it once and retain it with the input. A completed paid preparation is reused;
        only a new model call needs new credit admission. Supports `Idempotency-Key`. Errors:
        `schema_not_found`, `identifier_conflict` (409), `insufficient_credits` (402).
      operationId: records.create
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordInput' }
            example:
              email: sarah@example.com
              firstName: Sarah
      responses:
        '201':
          description: The created record.
          headers:
            Idempotent-Replay:
              $ref: "#/components/headers/IdempotentReplay"
            Operation-Id:
              schema:
                type: string
              description: Operation identifier for reconciliation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          description: The operation outcome could not be confirmed. Preserve Operation-Id and the original
            key/body; reconcile before a new operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdempotencyUnknownError"

  /schemas/{schema}/records/upsert:
    parameters:
      - { $ref: '#/components/parameters/SchemaParam' }
    post:
      tags: [Records]
      summary: Upsert a record
      description: >-
        Creates or updates a contact or object. An explicit id selects that exact record or returns
        record_not_found. Otherwise contact matching uses userId first; email can match only a
        contact without userId; phone can match only a contact without userId or email. Objects
        match by externalId. Per-field identifier collisions may be skipped and reported in
        warnings; inspect the returned record. Returns 201 for creation or 200 for update. Any
        missing AI auto-fill value on a new record requires a timed Idempotency-Key in the format
        `rpi1.<13-digit Unix milliseconds>.<UUIDv4>`. Generate it once and retain it with the input.
        Paid prepared values can complete a retry without new credits; new model calls still require
        credit admission. Required writable fields without a value/default can fail with
        required_attribute_missing (400, issues names the key).
      operationId: records.upsert
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordInput' }
            example:
              userId: customer_1042
              email: sarah@example.com
              firstName: Sarah
      responses:
        '200':
          description: The updated record.
          headers:
            Idempotent-Replay:
              $ref: "#/components/headers/IdempotentReplay"
            Operation-Id:
              schema:
                type: string
              description: Operation identifier for reconciliation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordEnvelope' }
        '201':
          description: The created record.
          headers:
            Idempotent-Replay:
              $ref: "#/components/headers/IdempotentReplay"
            Operation-Id:
              schema:
                type: string
              description: Operation identifier for reconciliation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          description: The operation outcome could not be confirmed. Preserve Operation-Id and the original
            key/body; reconcile before a new operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdempotencyUnknownError"

  /schemas/{schema}/records/{id}:
    parameters:
      - { $ref: '#/components/parameters/SchemaParam' }
      - { $ref: '#/components/parameters/RecordIdParam' }
    get:
      tags: [Records]
      summary: Get a record
      operationId: records.get
      responses:
        '200':
          description: The record.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }
      description: Reads one contact or object in this schema. Stored custom values and platform fields
        are flattened; evaluated and aggregate attributes are not expanded. There is no
        include/expand query. Missing schema or record returns 404.
    patch:
      tags: [Records]
      summary: Update a record
      description: >-
        Partially updates a record. The path id overrides any body id. Explicit null clears a
        nullable field; omit a field to preserve it. Non-writable evaluated/aggregate keys are not
        accepted as stored inputs. Normalization and skipped per-field identity updates can produce
        warnings. The endpoint does not use Idempotency-Key. Errors: schema_not_found,
        record_not_found, identifier_conflict, or required_attribute_missing (400, issues names the
        missing key).
      operationId: records.update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordInput' }
            example:
              firstName: Sarah
      responses:
        '200':
          description: The updated record.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [Records]
      summary: Delete a record
      operationId: records.delete
      parameters:
        - $ref: '#/components/parameters/RecordDeletionAttemptKeyParam'
      responses:
        '200':
          description: Record deletion is completed.
          content:
            application/json:
              example:
                data:
                  operationId: delete:records:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
                  status: completed
                  canCancel: false
                  message: Record deletion is completed.
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/RecordDeletionStatus"
                  warnings:
                    $ref: "#/components/schemas/Warnings"
        '202':
          description: Deletion is unfinished. Poll the operation until status is completed.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/RecordDeletionStatus"
                  warnings:
                    $ref: "#/components/schemas/Warnings"
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }
        "409":
          $ref: "#/components/responses/Conflict"
      description: >-
        Requests durable deletion of a contact or object. Requires an Idempotency-Key identifying
        this explicit attempt: 1..128 characters, beginning with an alphanumeric character and
        containing only alphanumeric characters, underscore, period, colon or hyphen. Preserve it
        when recovering a lost response. The key identifies the operation; it does not use generic
        response-cache replay headers. The response carries operationId/status/canCancel/message.
        New admissions pause while accepted Events and deliveries drain; no records have been removed
        at that stage. Once removal begins, conflicting workspace work remains closed during cleanup.
        Poll GET /record-deletions/{operationId}; pending is unfinished, blocked needs reconciliation,
        and completed confirms erasure. Cancellation is available to the original requester with
        current write permission only before removal begins. This handler returns HTTP 202 for
        non-completed states and HTTP 200 for completed. A cancelled attempt must not be reused as
        a new deletion. An unknown record returns 404 record_not_found; after completion, retrying
        DELETE can therefore return 404, so retain the operationId for status inspection.

  /schemas/{schema}/records/{id}/audit-trail:
    parameters:
      - { $ref: '#/components/parameters/SchemaParam' }
      - { $ref: '#/components/parameters/RecordIdParam' }
    get:
      tags: [Records]
      summary: List a contact's audit trail
      description: >
        Lists the consent and communication audit trail for a contact, newest first. Contact schemas
        only. Errors: `schema_not_found`, `record_not_found`.
      operationId: records.auditTrail
      parameters:
        - name: channel
          in: query
          required: false
          description: Filter by communication channel.
          schema: { $ref: '#/components/schemas/CommunicationChannel' }
        - { $ref: '#/components/parameters/LimitParam' }
        - { $ref: '#/components/parameters/OffsetParam' }
      responses:
        '200':
          description: A page of audit-trail entries.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AuditTrailEntry' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /contacts/suppressions:
    get:
      tags: [Suppressions]
      summary: List suppressions
      description: >
        Lists suppressions for the caller's space, newest first. Includes global suppressions (not
        space-scoped) alongside space-scoped ones, since both block sends to the caller's contacts.
        Requires an admin key.
      operationId: suppressions.list
      parameters:
        - name: identifier
          in: query
          required: false
          description: Filter to the suppression(s) for one email address.
          schema: { type: string, format: email }
        - { $ref: '#/components/parameters/LimitParam' }
        - { $ref: '#/components/parameters/OffsetParam' }
      responses:
        '200':
          description: A page of suppressions.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Suppression' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Suppressions]
      summary: Create a suppression
      description: >
        Suppresses an email identifier for the space. Requires an admin key. Not Idempotency-Key
        aware. Error: `suppression_already_exists` (409; `manual` and `legal` are distinct reasons).
      operationId: suppressions.create
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SuppressionInput' }
      responses:
        '201':
          description: The created suppression.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Suppression' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /contacts/suppressions/batch:
    post:
      tags: [Suppressions]
      summary: Batch-create suppressions
      description: >
        Bulk-creates 1 to 100 suppressions in one call. Each item is validated and processed
        independently: an existing suppression for the same identifier and reason returns `exists`
        rather than failing the item. Requires an admin key. Supports `Idempotency-Key`. Always
        responds `200`.
      operationId: suppressions.batchCreate
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SuppressionBatchCreateRequest' }
      responses:
        '200':
          description: Per-item results and a summary.
          headers:
            Idempotent-Replay:
              $ref: "#/components/headers/IdempotentReplay"
            Operation-Id:
              schema:
                type: string
              description: Operation identifier for reconciliation.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/SuppressionBatchCreateResult' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
