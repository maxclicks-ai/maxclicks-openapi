                  pagination: { $ref: '#/components/schemas/Pagination' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Webhooks]
      summary: Create a webhook
      description: >
        Creates a webhook. The response includes `signatureVerificationSecret`,
        which is shown here and on rotate-secret only. Save it immediately. A
        `custom filter` condition generates via AI (in the `ai` rate bucket;
        credits are checked first) and stores only its human-readable
        description; the generated expression is never returned. Not
        Idempotency-Key aware (a secret-returning create). Errors:
        `invalid_webhook`, `schema_not_found`, `segment_not_found`,
        `webhook_filter_generation_failed` (422), `insufficient_credits` (402).
      operationId: webhooks.create
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookCreate' }
      responses:
        '201':
          description: The created webhook, including its signing secret.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/WebhookWithSecret' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /webhooks/{id}:
    parameters:
      - { $ref: '#/components/parameters/WebhookIdParam' }
    get:
      tags: [Webhooks]
      summary: Get a webhook
      operationId: webhooks.get
      responses:
        '200':
          description: The webhook.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Webhook' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }
    patch:
      tags: [Webhooks]
      summary: Update a webhook
      description: >
        Updates url, email event types, condition, and/or status. Trigger and
