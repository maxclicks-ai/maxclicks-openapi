              type: object
              description: Per-workflow-step payload, validated against the step's JSON schema.
              additionalProperties: true
      responses:
        '200':
          description: The workflow run was started.
          headers:
            Idempotent-Replay:
              $ref: "#/components/headers/IdempotentReplay"
            Operation-Id:
              schema:
                type: string
              description: Operation identifier for reconciliation.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                description: "`data` is an empty object."
                properties:
                  data: { type: object }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '400':
          $ref: "#/components/responses/BadRequest"
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          $ref: "#/components/responses/NotFound"
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500':
          $ref: "#/components/responses/ServerError"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          description: The operation outcome could not be confirmed. Preserve Operation-Id and the original
            key/body; reconcile before a new operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdempotencyUnknownError"

  /workflows/{id}/pause:
    parameters:
      - { $ref: '#/components/parameters/WorkflowIdParam' }
    post:
      tags: [Workflows]
      summary: Pause a workflow
      description: >-
        Pauses the workflow: new triggers and further execution of existing runs are blocked. An
        external effect already in flight may complete. Supports Idempotency-Key. Error:
        workflow_not_found.
      operationId: workflows.pause
      responses:
        '200':
          description: The paused workflow.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Workflow' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
          headers:
            Idempotent-Replay:
              $ref: "#/components/headers/IdempotentReplay"
            Operation-Id:
              schema:
                type: string
              description: Operation identifier for reconciliation.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          description: The operation outcome could not be confirmed. Preserve Operation-Id and the original
            key/body; reconcile before a new operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdempotencyUnknownError"
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyParam"

  /workflows/{id}/unpause:
    parameters:
      - { $ref: '#/components/parameters/WorkflowIdParam' }
    post:
      tags: [Workflows]
      summary: Unpause a workflow
      description: "Unpauses the workflow so eligible paused work can continue. This does not publish
        unpublished edits or redrive terminal failed runs. Supports Idempotency-Key. Error:
        workflow_not_found."
      operationId: workflows.unpause
      responses:
        '200':
          description: The unpaused workflow.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Workflow' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
          headers:
            Idempotent-Replay:
              $ref: "#/components/headers/IdempotentReplay"
            Operation-Id:
              schema:
                type: string
              description: Operation identifier for reconciliation.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          description: The operation outcome could not be confirmed. Preserve Operation-Id and the original
            key/body; reconcile before a new operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdempotencyUnknownError"
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyParam"

  /workflows/{id}/runs:
    parameters:
      - { $ref: '#/components/parameters/WorkflowIdParam' }
    get:
      tags: [Workflows]
      summary: List a workflow's runs
      description: "Lists runs newest first. Each run embeds at most its latest 100 history entries,
        ascending within that window. Use workflows.getRun with nextHistoryBeforeIndex to read
        earlier history. Error: workflow_not_found."
      operationId: workflows.listRuns
      parameters:
        - { $ref: '#/components/parameters/LimitParam' }
        - { $ref: '#/components/parameters/OffsetParam' }
      responses:
        '200':
          description: A page of workflow runs.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/WorkflowRun' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /workflows/{id}/runs/{runId}:
    parameters:
      - { $ref: '#/components/parameters/WorkflowIdParam' }
      - name: runId
        in: path
        required: true
        description: The workflow run id.
        schema: { type: string }
    get:
      tags: [Workflows]
      summary: Get a workflow run
      description: "Returns public run status and a window of at most 100 step-history records, ordered by
        index ascending within the returned window. The initial window contains the latest records.
        To read older history, pass nextHistoryBeforeIndex as history_before until it is null.
        status is running while a current step exists; otherwise failed if the run has a failed
        step, or completed. failureReason comes from the returned window and can be null even for a
        failed run whose failure is older. No internal step graph, handling state, or input/output
        data is returned. Errors: workflow_not_found, workflow_run_not_found."
      operationId: workflows.getRun
      responses:
        '200':
          description: The workflow run.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/WorkflowRun' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }
        "400":
          $ref: "#/components/responses/BadRequest"
      parameters:
        - name: history_before
          in: query
          required: false
          description: Return step-history indices strictly below this non-negative safe integer. Use the
            previous nextHistoryBeforeIndex; omit for the latest 100 entries.
          schema:
            type: integer
            minimum: 0
            maximum: 9007199254740991

  /forms/{formId}/submit:
    parameters:
      - { $ref: '#/components/parameters/FormIdParam' }
    post:
      tags: [Forms]
      summary: Submit a form
      description: >
        Public, unauthenticated form submission (the tenant is derived from the form, not an API
        key). Validates required fields, CAPTCHA, and consent, then upserts the contact or (for
        double opt-in, when the visitor opted in to email) stores a pending record and emails a
        confirmation link. A declined-consent submission always goes through the direct path even on
        a double opt-in form. Rate limits: per IP 10/60s and per form 120/60s (both fail open if
        Redis is down), plus a separate per-recipient/per-form cap on confirmation emails. Error:
        `rate_limit_exceeded`. A direct submission that needs missing AI auto-fill values requires
        a timed submissionId. Retain it across network and CAPTCHA retries; do not generate a new
        ID for an unanswered request. The ID uses the same format and retry window as timed record
        Idempotency-Key values. Confirmation has its own persisted server identity and token expiry.
      operationId: forms.submit
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FormSubmission' }
            example:
              contact:
                email: sarah@example.com
                firstName: Sarah
              emailMarketingConsent: false
      responses:
        '200':
          description: The submission was accepted.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/FormSubmissionResult' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /forms/{formId}/confirm/{token}:
    parameters:
      - { $ref: '#/components/parameters/FormIdParam' }
      - name: token
        in: path
        required: true
        description: The single-use double opt-in token from the confirmation email.
        schema: { type: string }
    get:
      tags: [Forms]
      summary: Confirm a double opt-in
      description: >
        Public browser navigation target for the double opt-in email link. Redeems the token,
        upserts the confirmed contact, and always redirects (302) to the hosted result page. Every
        failure path (missing/expired token, unpublished form) also redirects to a "failed" landing
        page rather than returning a JSON error. Same rate limits as `forms.submit`.
      operationId: forms.confirmDoubleOptIn
      security: []
      responses:
        '302':
          description: Redirect to the hosted confirmation result page.
          headers:
            Location:
              description: The result page URL.
              schema: { type: string, format: uri }

  /emails/{emailId}/unsubscribe:
    parameters:
      - name: emailId
        in: path
        required: true
        description: The id of the sent email.
        schema: { type: string }
    post:
      tags: [Emails]
      summary: One-click unsubscribe
      description: >
        Public RFC 8058 one-click unsubscribe target. Unsubscribes the linked contact from a topic
        or the whole email channel, then redirects (302) to the hosted result page. No rate limit at
        all on this endpoint.
      operationId: emails.unsubscribeOneClick
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [List-Unsubscribe]
              properties:
                List-Unsubscribe:
                  type: string
                  const: One-Click
      responses:
        '302':
          description: Redirect to the hosted unsubscribe result page.
          headers:
            Location:
              description: The result page URL.
              schema: { type: string, format: uri }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /events/{schema}/{id}/status:
    get:
      tags:
        - Events
      summary: Get event readiness
      operationId: events.status
      description: Read the current readiness of an accepted event by its maxclicks event id, including
        pending, ready, failed, and outcome_unknown states. This is distinct from the immutable
        readinessAtAcceptance returned when firing or retrying the event. data contains raw
        acceptance values until preparation is ready. A missing event or event schema returns 404.
        Acceptance and readiness do not prove that a downstream workflow, webhook, or email
        completed.
      parameters:
        - name: schema
          in: path
          required: true
          description: Event schema id or slug.
          schema:
            type: string
            example: purchase-completed
        - name: id
          in: path
          required: true
          description: The maxclicks event id from the acceptance receipt, not your eventId.
          schema:
            type: string
            example: ev_BcwDvBUeSaSDILA5tHgpmU7I
      responses:
        "200":
          description: Current event readiness and accepted/prepared data.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/EventStatus"
                  warnings:
                    $ref: "#/components/schemas/Warnings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"
  /event-identities:
    post:
      tags:
        - Events
      summary: Bind an anonymous event identity
      operationId: eventIdentities.identify
      description: Binds or unbinds an anonymous browser identity to a contact using a server-held API key
        with write permission. An enabled contact track definition must match sourceId and
        subjectSchemaId in the space. Send contactId=null to remove the binding. All six body fields
        are required and unknown fields are rejected. Use a UUID operationId for replay of the same
        input; a changed body under that operationId returns 409. expectedAliasRevision is the last
        revision of this specific alias as a decimal string, or "0" for a new alias. Keep the
        returned identityRevision for the next change to that alias. Revision conflicts and erased
        aliases return 409; an unavailable source returns 403. Capacity is bounded at 100,000
        aliases and 1,000,000 changes per space; exhausted capacity returns 429 without promising
        automatic recovery. Idempotency-Key is not used.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventIdentityInput"
      responses:
        "200":
          description: The committed identity revision.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/EventIdentityResult"
                  warnings:
                    $ref: "#/components/schemas/Warnings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"
  /record-deletions/{operationId}:
    get:
      tags:
        - Records
      summary: Get record deletion status
      operationId: records.getDeletion
      description: >-
        Poll a record-deletion operation in the caller's space. pending means drain, cancellation
        or cleanup is unfinished; inspect message for the current phase. blocked needs reconciliation;
        completed confirms deletion, and cancelled confirms cancellation before record removal.
        A missing or out-of-scope operation returns 404. Preserve operationId from records.delete.
        This read-only response reports canCancel=false; cancellation eligibility is enforced
        separately by records.cancelDeletion against the current requester and operation phase.
      parameters:
        - name: operationId
          in: path
          required: true
          description: The full operationId returned by records.delete.
          schema:
            type: string
            example: delete:records:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      responses:
        "200":
          description: Current deletion status.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/RecordDeletionStatus"
                  warnings:
                    $ref: "#/components/schemas/Warnings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"
  /record-deletions/{operationId}/cancel:
    post:
      tags: [Records]
      summary: Cancel a record deletion before removal
      operationId: records.cancelDeletion
      description: >-
        Requests cancellation during the initial admission-drain phase, before data removal begins.
        Requires the original requesting user and current Write permission in the workspace.
        Returns 202 while collection intake retirement is acknowledged, then 200 for an already
        cancelled operation. Poll records.getDeletion until status=cancelled. Repeating cancellation
        during cancellation or after it completes returns the current operation status. There is no
        separate Idempotency-Key for this route: operationId identifies the existing operation.
        A different requester or out-of-scope operation returns 404. Removal already begun returns
        409; a currently leased admission check also returns 409 and requires waiting before retrying.
        Cancellation cannot restore data after removal begins.
      parameters:
        - name: operationId
          in: path
          required: true
          description: The full operationId returned by records.delete.
          schema: { type: string }
      responses:
        '200':
          description: The operation was already cancelled.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/RecordDeletionStatus' }
        '202':
          description: Cancellation is pending; poll the deletion operation.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/RecordDeletionStatus' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Your API key sent as a bearer token in the `Authorization` header: `Authorization: Bearer
        <api_key>`. The server also accepts the raw key without the `Bearer ` prefix, but clients
        should always send `Bearer`.
    oauth2:
      type: oauth2
      description: >
        An OAuth 2.1 access token for a connection the user approved for one workspace, sent as
        `Authorization: Bearer <access_token>`. Discover the server from
        https://api.maxclicks.ai/.well-known/oauth-authorization-server or from the
        `resource_metadata` in any 401 `WWW-Authenticate` header. Identify the app with a Client ID
        Metadata Document, using the https URL of a JSON document it publishes as its `client_id`
        (`client_id_metadata_document_supported`), or register with dynamic client registration at
        https://api.maxclicks.ai/oauth/register. Authorization requires PKCE with
        S256 and accepts `resource` (https://api.maxclicks.ai/v1 for this API). Access tokens last one
        hour; refresh tokens rotate on every use, and presenting an old one again ends the
        connection. An operation needs the scope matching its permission: `read` for list and
        retrieve, `write` for changes and sends, `admin` for suppressions. A missing scope answers
        403 `insufficient_scope`.
      flows:
        authorizationCode:
          authorizationUrl: https://api.maxclicks.ai/oauth/authorize
          tokenUrl: https://api.maxclicks.ai/oauth/token
          refreshUrl: https://api.maxclicks.ai/oauth/token
          scopes:
            read: Read records, events, segments, templates, campaigns, workflows and sending setup.
            write: Create and change records, fire events, send templates and broadcasts, and run workflows.
            admin: Add and remove email suppressions.

  headers:
    IdempotentReplay:
      description: >
        Present and `true` when this response was replayed verbatim from a prior request that used
        the same `Idempotency-Key`.
      schema: { type: boolean }

  parameters:
    LimitParam:
      name: limit
      in: query
      required: false
      description: Page size. Clamped to 1..200 with a warning if out of range.
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 200
    OffsetParam:
      name: offset
      in: query
      required: false
      description: >-
        Rows to skip. Negative values clamp to 0 with a warning; above 10000 returns 400
        offset_too_large. pagination.hasMore becomes false when the next offset reaches the cap even
        if totalCount is larger. Records list has no ad-hoc filter; this is not an unlimited export
        contract.
      schema:
        type: integer
        default: 0
        minimum: 0
        maximum: 10000
    IdempotencyKeyParam:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Stable key for one logical write, maximum 256 characters. Scoped to calling API key, method,
        and resolved path, with a canonical request-body fingerprint. Replays recorded status/body
        with Idempotent-Replay=true. Failed record create/upsert requests retain status and stable
        error code with a constant message; detailed validation information is only in the first
        authorized response. Follow the code's retry policy, rather than creating a new key
        from the HTTP status alone. Changed input returns 422
        idempotency_key_reused; active work returns 409 idempotency_conflict; unresolved work
        returns idempotency_outcome_unknown. Ordinary opaque keys keep their existing 24-hour
        completed-response retention. For record create/upsert that needs missing AI auto-fill,
        use rpi1.<13-digit Unix milliseconds>.<UUIDv4>. The rpi1. prefix is reserved for timed
        record keys and is checked before cached-response replay. Its retry window ends 24 hours
        after the issue time rounded up to the next minute. A clock more than five minutes ahead
        is refused. Expired keys are permanently refused, including after receipt cleanup.
        An expired or unknown result must be reconciled; do not automatically mint a new key.
        Unresolved financial/provider work remains retained. Erased record responses return 410
        instead of replaying private data. Other idempotent operations keep their own key rules.
      schema: { type: string, maxLength: 256 }
    RecordDeletionAttemptKeyParam:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Stable identity for this explicit deletion attempt. Keep the same key to recover its
        operation status. This does not use generic response caching or replay headers. A new
        attempt after cancellation requires a new key; inspect the original operation first.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$'
    TemplateSendIdempotencyKeyParam:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Non-blank identity for one template send. Keep the same API key, template and input when
        retrying. The identity is scoped to the space and calling API key; using it for a different
        template or input returns 409 template_send_operation_conflict. A retry resumes the saved
        preparation or delivery and reuses its exact message and recipient. It does not replay a
        generic cached HTTP response, return Idempotent-Replay or Operation-Id, or permit key reuse
        after the generic 24-hour response-cache period. An erased request returns 410
        template_send_erased. An unknown result needs reconciliation; do not mint a replacement key.
      schema: { type: string, minLength: 1, pattern: '\S' }
    SchemaParam:
      name: schema
      in: path
      required: true
      description: A schema id or slug.
      schema: { type: string }
    RecordIdParam:
      name: id
      in: path
      required: true
      description: The record's platform id.
      schema: { type: string }
    SuppressionIdParam:
      name: id
      in: path
      required: true
      description: The suppression id.
      schema: { type: string }
    DomainIdParam:
      name: id
      in: path
      required: true
      description: The domain id.
      schema: { type: string }
    TopicIdParam:
      name: id
      in: path
      required: true
      description: The topic id.
      schema: { type: string }
    SegmentIdParam:
      name: id
      in: path
      required: true
      description: The segment id.
      schema: { type: string }
    BroadcastIdParam:
      name: id
      in: path
      required: true
      description: The broadcast id.
      schema: { type: string }
    TemplateIdParam:
      name: id
      in: path
      required: true
      description: The template id.
      schema: { type: string }
    WebhookIdParam:
      name: id
      in: path
      required: true
      description: The webhook id.
      schema: { type: string }
    WorkflowIdParam:
      name: id
      in: path
      required: true
      description: The workflow id.
      schema: { type: string }
    FormIdParam:
      name: formId
      in: path
      required: true
      description: The form id.
      schema: { type: string }

  responses:
    BadRequest:
      description: >
        The request was malformed or failed validation. Also covers `malformed_json` (body is not
        valid JSON) and, on list endpoints, `offset_too_large`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: >
        The credential is missing or invalid: `invalid_api_key` for an API key, `invalid_access_token`
        for an expired or revoked OAuth access token. The `WWW-Authenticate` header names the
        resource metadata, from which an OAuth client finds the authorization server.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: >
        The key lacks permission, or the space is out of scope. An OAuth connection whose user holds
        the permission but did not grant it answers `insufficient_scope`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: The referenced resource was not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: The write conflicts with an existing resource or the resource's current state.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Gone:
      description: The record operation expired or its stored response was erased. Reconcile the original operation before starting a new one.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PaymentRequired:
      description: >
        Insufficient credits (`insufficient_credits`) for an AI-generation call or a schema with AI
        auto-fill, or the space's email allowance is exhausted (`email_limit_reached`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UnprocessableEntity:
      description: >
        The request was well-formed but could not be processed, typically a failed AI-generation
        call or a readiness gate (which may carry `error.issues`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: A request rate or capacity limit was reached. Follow the error code and Retry-After; a capacity refusal can follow durable preparation.
      headers:
        Retry-After:
          description: Retry delay as HTTP-date or seconds when supplied. Event per-item admission failures
            report retryAfterMilliseconds inside the result instead.
          schema: { type: string }
        RateLimit-Policy:
          description: Each limit that applies, as `"<bucket>";q=<quota>;w=<window seconds>` (draft-ietf-httpapi-ratelimit-headers).
            Sent on every rate-limited response, not only on 429.
          schema: { type: string }
        RateLimit:
          description: Quota left under each limit, as `"<bucket>";r=<remaining>;t=<seconds until reset>`.
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PayloadTooLarge:
      description: The request body exceeds the 10 MB limit.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UnsupportedMediaType:
      description: The request used an unsupported content type, charset, or content encoding.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    IngestUnavailable:
      description: >
        A downstream event dependency is unavailable: the ingest pipeline (`ingest_unavailable`, on
        `events.fire`/`events.fireBatch`) or the ClickHouse-backed event archive
        (`event_archive_unavailable`, on `events.list`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServerError:
      description: The API failed to process a valid request.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    ErrorObject:
      type: object
      required: [type, code, message]
      properties:
        type:
          type: string
          enum: [invalid_request_error, api_error]
        code:
          type: [string, 'null']
          description: A stable machine-readable code, or null.
        message:
          type: string
        issues:
          type: array
          description: >
            Present only for validation-gate failures that report more than one distinct problem at
            once (e.g. `broadcasts.send`'s `broadcast_invalid`).
          items: { type: string }

    Error:
      type: object
      required: [error]
      properties:
        error: { $ref: '#/components/schemas/ErrorObject' }

    Warnings:
      type: array
      description: Non-fatal warnings accumulated while processing the request.
      items: { type: string }
      example: []

    Pagination:
      type: object
      required: [limit, offset, totalCount, hasMore]
      properties:
        limit: { type: integer }
        offset: { type: integer }
        totalCount: { type: integer }
        hasMore:
          type: boolean
          description: True only when more rows exist AND offset + limit is below 10000. False can reflect the
            traversal cap even if totalCount is larger; it does not guarantee a full export.

    CursorPagination:
      type: object
      description: Cursor pagination envelope, used only by `events.list`.
      required: [limit, nextCursor, hasMore]
      properties:
        limit: { type: integer }
        nextCursor:
          type: [string, 'null']
          description: Opaque cursor for the next page, or null when there are no more rows.
        hasMore: { type: boolean }

    Deleted:
      type: object
      required: [id, deleted]
      properties:
        id: { type: string }
        deleted: { type: boolean, const: true }

    DeletedEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Deleted' }
        warnings: { $ref: '#/components/schemas/Warnings' }

    RecordEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Record' }
        warnings: { $ref: '#/components/schemas/Warnings' }

    SchemaType:
      type: string
      enum: [contact, object, event]

    ContactSource:
      type: string
      enum: [import, api, form, manual, workflow, integration]

    CommunicationChannel:
      type: string
      enum: [email]

    BadgeColor:
      type: string
      description: A display color for tags and topics.
      enum:
        [
          red,
          orange,
          amber,
          yellow,
          lime,
          green,
          emerald,
          teal,
          cyan,
          sky,
          blue,
          indigo,
          violet,
          purple,
          fuchsia,
          pink,
          rose,
          zinc
        ]

    SuppressionReason:
      type: string
      description: >
        All possible suppression reasons on read. Only `manual` and `legal` can be created or
        removed through the API; the rest are system-applied (bounce, complaint, unsubscribe) and
        read-only.
      enum: [manual, legal, unsubscribed, hard_bounce, soft_bounce_consecutive, spam_complaint]

    SuppressionCreateReason:
      type: string
      enum: [manual, legal]

    RoleName:
      type: string
      enum: [admin, non-paid admin, member]

    Me:
      type: object
      required: [apiKey, user, space, role, oauth]
      properties:
        apiKey:
          type: object
          required: [id, name, keyDisplay, createdAt]
          properties:
            id: { type: string }
            name: { type: [string, 'null'] }
            keyDisplay: { type: string }
            createdAt: { type: string, format: date-time }
        user:
          type: object
          required: [id, email, name]
          properties:
            id: { type: string }
            email: { type: string, format: email }
            name: { type: [string, 'null'] }
        space:
          type: [object, 'null']
          properties:
            id: { type: string }
            slug: { type: string }
            name: { type: string }
        role:
          type: [object, 'null']
          properties:
            name: { $ref: '#/components/schemas/RoleName' }
            label: { type: string }
            description: { type: string }
        oauth:
          type: [object, 'null']
          description: >
            Present for an OAuth access token and null for an API key. For an OAuth connection,
            `apiKey` describes the connection itself, named after the app.
          required: [clientId, resource, scopes, expiresAt]
          properties:
            clientId:
              type: string
              description: >
                The OAuth client the connection was granted to: its registered id, or the URL of its
                Client ID Metadata Document.
            resource:
              type: string
              format: uri
              description: The resource the token was issued for, the MCP server or this API.
            scopes:
              type: array
              items: { type: string, enum: [read, write, admin] }
            expiresAt: { type: string, format: date-time }

    Schema:
      type: object
      required:
        [
          id,
          type,
          slug,
          name,
          namePlural,
          description,
          integrationVendorName,
          attributeCount,
          createdAt,
          updatedAt
        ]
      properties:
        id: { type: string }
        type: { $ref: '#/components/schemas/SchemaType' }
        slug: { type: string }
        name: { type: string }
        namePlural: { type: string }
        description: { type: [string, 'null'] }
        integrationVendorName: { type: [string, 'null'] }
        attributeCount:
          type: integer
          description: Count of custom attribute rows only (base attributes excluded).
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AttributeDefinition:
      type: object
      description: >-
        Attribute definition metadata. Stored definitions carry nullable; evaluated definitions use
        target=schema or json. An aggregate keeps a stored type and adds valueSource.type=aggregate;
        it is not writable. Writable stored fields have no valueSource. Optional autoFill uses
        mode=default with defaultValue, or mode=ai with optional prompt. Evaluated and aggregate
        values require app/runtime expansion and are not included in public record reads. Types
        url/email/phone/ref/object do not exist; use string formats and json as documented.
        Generated evaluated expressions are never returned.
      required: [type]
      properties:
        type:
          type: string
          enum:
            - string
            - number
            - decimal
            - boolean
            - date time
            - date only
            - time only
            - string array
            - json
            - evaluated
        nullable:
          type: boolean
          description: Present on every stored definition. Absent on `evaluated`.
        multiLine:
          type: boolean
          description: "On `type: string` only. Selects which `format` values are available."
        format:
          type: string
          description: >
            On `type: string` only. With `multiLine` false or absent: `plain text`, `email`, `phone`
            or `url`. With `multiLine: true`: `plain text` or `code`.
        jsonSchema:
          type: object
          description: "On `type: json` only. A simplified JSON Schema, including for nested structures."
        autoFill:
          type: object
          description: "Stored field: mode default with defaultValue, or mode ai with optional prompt."
          additionalProperties: true
        valueSource:
          type: object
          description: "Aggregate metadata: type=aggregate; eventSchemaId identifies
            the source Event schema;
            specification(operation=count|sum|latest,valueProperty,dimensionProperty,filter,windowS\
            econds); cadenceSeconds,enabled,revision. Makes this stored type non-writable."
          additionalProperties: true
        target:
          type: string
          enum:
            - schema
            - json
          description: Evaluated only. schema requires
            schemaId,cardinality,requirements,queryDescriptionMarkdown,expressionReferences. json
            requires
            jsonSchema,requirements,descriptionMarkdown,expressionReferences,expressionOutput=json|query.
        cardinality:
          type: string
          enum:
            - one
            - many
        schemaId:
          type: string
      additionalProperties: true

    Attribute:
      type: object
      required:
        [
          id,
          key,
          label,
          description,
          sequence,
          definition,
          integrationVendorName,
          createdAt,
          updatedAt
        ]
      properties:
        id:
          type: string
          description: A custom attribute id, or `base:<key>` for platform base attributes.
        key: { type: string }
        label: { type: string }
        description: { type: [string, 'null'] }
        sequence:
          type: [string, 'null']
          description: Ordering value for custom attributes; null for base attributes.
        definition: { $ref: '#/components/schemas/AttributeDefinition' }
        integrationVendorName: { type: [string, 'null'] }
        createdAt: { type: [string, 'null'], format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }

    EmailStatistics:
      type: object
      required: [sent, delivered, bounced, complained, unsubscribed, uniqueOpens, uniqueClicks]
      properties:
        sent: { type: integer }
        delivered: { type: integer }
        bounced: { type: integer }
        complained: { type: integer }
        unsubscribed: { type: integer }
        uniqueOpens: { type: integer }
        uniqueClicks: { type: integer }

    ContactRecord:
      type: object
      description: Contact record. Stored custom values are top-level; platform fields override colliding
        keys. Evaluated/aggregate values are not expanded by public record reads.
      required:
        - id
        - schemaId
        - schemaSlug
        - source
        - fullName
        - firstName
        - lastName
        - avatarUrl
        - userId
        - email
        - phone
        - subscriptions
        - topicIds
        - notes
        - tags
        - emailStatistics
        - createdAt
        - updatedAt
      properties:
        id: { type: string }
        schemaId: { type: string }
        schemaSlug: { type: string }
        source: { $ref: '#/components/schemas/ContactSource' }
        fullName: { type: [string, 'null'] }
        firstName: { type: [string, 'null'] }
        lastName: { type: [string, 'null'] }
        avatarUrl: { type: [string, 'null'] }
        userId: { type: [string, 'null'] }
        email: { type: [string, 'null'], format: email }
        phone: { type: [string, 'null'] }
        subscriptions:
          type: array
          items: { $ref: '#/components/schemas/CommunicationChannel' }
        topicIds:
          type: array
          items: { type: string }
        notes: { type: [string, 'null'] }
        tags:
          type: array
          items: { type: string }
        emailStatistics:
          oneOf:
            - { $ref: '#/components/schemas/EmailStatistics' }
            - { type: 'null' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      additionalProperties: true

    ObjectRecord:
      type: object
      description: Object record. Stored custom values are top-level; platform fields override colliding
        keys. Evaluated/aggregate values are not expanded by public record reads.
      required: [id, schemaId, schemaSlug, externalId, notes, tags, createdAt, updatedAt]
      properties:
        id: { type: string }
        schemaId: { type: string }
        schemaSlug: { type: string }
        externalId: { type: [string, 'null'] }
        notes: { type: [string, 'null'] }
        tags:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      additionalProperties: true

    Record:
      description: Contact or object record with stored custom values and platform fields flattened at the
        top level. Public record reads do not expand evaluated or aggregate attribute values.
      oneOf:
        - { $ref: '#/components/schemas/ContactRecord' }
        - { $ref: '#/components/schemas/ObjectRecord' }

    RecordInput:
      type: object
      description: >
        Input for creating, upserting, or updating a record. All fields are optional. For a contact
        schema the contact fields apply; for an object schema the object fields apply. Custom
        attribute keys are passed at the top level.
      properties:
        id: { type: string }
        fullName: { type: [string, 'null'] }
        firstName: { type: [string, 'null'] }
        lastName: { type: [string, 'null'] }
        avatarUrl: { type: [string, 'null'] }
        userId: { type: [string, 'null'] }
        email: { type: [string, 'null'], format: email }
        phone: { type: [string, 'null'] }
        subscriptions:
          type: array
          items: { $ref: '#/components/schemas/CommunicationChannel' }
        topicIds:
          type: array
          items: { type: string }
        externalId: { type: [string, 'null'] }
        notes: { type: [string, 'null'] }
        tags:
          type: array
          items: { type: string }
      additionalProperties: true

    AuditTrailEntry:
      type: object
      required:
        - id
        - createdAt
        - communicationChannel
        - communicationTopicIds
        - eventType
        - state
        - optInLevel
        - actorType
        - actorIdentifier
        - context
      properties:
        id: { type: string }
        createdAt: { type: string, format: date-time }
        communicationChannel: { $ref: '#/components/schemas/CommunicationChannel' }
        communicationTopicIds:
          type: array
          items: { type: string }
        eventType:
          type: string
          enum:
            - email_verification_sent
            - email_verified
            - phone_verification_sent
            - phone_verified
            - subscribed
            - unsubscribed
            - topics_added
            - topics_removed
            - suppressed
            - unsuppressed
        state:
          type: [string, 'null']
          enum: [subscribed, not_subscribed, unsubscribed, pending, invalid, redacted, null]
        optInLevel:
          type: [string, 'null']
          enum: [single, double, unknown, null]
        actorType:
          type: string
          enum: [contact, admin, system, api]
        actorIdentifier: { type: [string, 'null'] }
        context:
          description: >
            Raw JSON context (consent text/version, IP, user agent, source URL, form id, timestamp).
            `ipAddress` and `userAgent` are stripped before being returned.

    SuppressionInput:
      type: object
      required: [identifier, reason]
      properties:
        identifier:
          type: string
          format: email
          description: The email address to suppress.
        reason: { $ref: '#/components/schemas/SuppressionCreateReason' }
        notes: { type: [string, 'null'] }

    Suppression:
      type: object
      required: [id, createdAt, communicationChannel, reason, notes, scope, identifierHash]
      properties:
        id: { type: string }
        createdAt: { type: string, format: date-time }
        communicationChannel: { $ref: '#/components/schemas/CommunicationChannel' }
        reason: { $ref: '#/components/schemas/SuppressionReason' }
        notes: { type: [string, 'null'] }
        scope:
          type: string
          enum: [space, global]
        identifierHash:
          type: string
          description: A hash of the suppressed identifier. The raw identifier is never returned.
        affectedContactCount:
          type: integer
          description: >
            Present only on `suppressions.create` and `suppressions.batchCreate` responses: contacts
            in the space whose identifier matched.

    SuppressionBatchCreateRequest:
      type: object
      required: [suppressions]
      properties:
        suppressions:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/SuppressionInput' }

    SuppressionBatchCreateResultItem:
      type: object
      required: [index, status]
      description: >
        Suppression fields are present when `status` is `created` or `exists`; `error` is present
        when `status` is `failed`.
      allOf:
        - type: object
          properties:
            index: { type: integer }
            status:
              type: string
              enum: [created, exists, failed]
            error: { $ref: '#/components/schemas/ErrorObject' }
        - $ref: '#/components/schemas/Suppression'

    SuppressionBatchCreateResult:
      type: object
      required: [results, summary]
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/SuppressionBatchCreateResultItem' }
        summary:
          type: object
          required: [created, exists, failed]
          properties:
            created: { type: integer }
            exists: { type: integer }
            failed: { type: integer }

    SuppressionBatchDeleteRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string }

    SuppressionBatchDeleteResultItem:
      type: object
      required: [index, status]
      properties:
        index: { type: integer }
        status:
          type: string
          enum: [removed, failed]
        error: { $ref: '#/components/schemas/ErrorObject' }

    SuppressionBatchDeleteResult:
      type: object
      required: [results, summary]
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/SuppressionBatchDeleteResultItem' }
        summary:
          type: object
          required: [removed, failed]
          properties:
            removed: { type: integer }
            failed: { type: integer }

    EventInput:
      type: object
      description: Flat event acceptance input. Custom writable attribute keys are top-level and
        normalized against the event schema. Any id is ignored on fire. Reserved readiness fields
        are not caller-controlled. Supply eventId for retry deduplication. The normalized input has
        a 256 KiB ceiling.
      properties:
        eventId:
          type: [string, 'null']
          description: Caller-owned occurrence identifier, scoped to the space and event schema. Reuse with
            identical input and occurredAt for retries. If omitted or null, the server generates a
            UUID; save the returned eventId. A changed payload under the same value returns
            event_id_conflict.
        occurredAt:
          type: string
          format: date-time
          description: When the event occurred. Defaults to acceptance time; explicit values must be no more
            than 366 days old or five minutes in the future. Preserve the same explicit value on
            retries.
        contactId:
          type:
            - string
            - "null"
          description: Explicit contact subject id in this space. Mutually exclusive with objectId.
        objectId:
          type:
            - string
            - "null"
          description: Explicit object subject id in this space. Mutually exclusive with contactId.
      additionalProperties: true

    FireResult:
      type: object
      required:
        - accepted
        - id
        - eventId
        - isDuplicate
        - readinessAtAcceptance
      properties:
        accepted:
          type: integer
          const: 1
          description: One event occurrence was durably accepted or replayed.
        id:
          type: string
          description: maxclicks event id; use it with events.status.
        eventId:
          type: string
          description: Caller-supplied or generated occurrence identifier.
        isDuplicate:
          type: boolean
        readinessAtAcceptance:
          type: string
          enum:
            - pending
            - ready
          description: Immutable original acceptance state. Poll events.status for current readiness.
      example:
        accepted: 1
        id: ev_BcwDvBUeSaSDILA5tHgpmU7I
        eventId: order_1042_paid
        isDuplicate: false
        readinessAtAcceptance: pending

    BatchFireItemResult:
      type: object
      required: [index, status]
      properties:
        index: { type: integer }
        status:
          type: string
          enum:
            - accepted
            - failed
            - rolled_back
        error: { $ref: '#/components/schemas/ErrorObject' }
        id:
          type: string
        eventId:
          type:
            - string
            - "null"
        isDuplicate:
          type: boolean
        readinessAtAcceptance:
          type: string
          enum:
            - pending
            - ready
        retryAfterMilliseconds:
          type: integer
          minimum: 0
          description: Present on an event-admission failure; delay before retrying that occurrence.

    BatchFireResult:
      type: object
      required: [results, summary]
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/BatchFireItemResult' }
        summary:
          type: object
          required: [accepted, failed]
          properties:
            accepted: { type: integer }
            failed: { type: integer }
        failedIndex:
          type: integer
          description: Present on abort. Index of the item whose failure stopped processing; later items were
            not attempted.
      example:
        results:
          - index: 0
            status: accepted
            id: ev_BcwDvBUeSaSDILA5tHgpmU7I
            eventId: order_1042_paid
            isDuplicate: false
            readinessAtAcceptance: pending
        summary:
          accepted: 1
          failed: 0

    EventBatchRequest:
      type: object
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/EventInput' }
        onError:
          type: string
          enum: [continue, abort]
          default: continue

    Event:
      type: object
      description: A ready business event. Custom stored values are flattened into the top level. Pending
        or failed acceptances are available through events.status instead.
      required:
        - id
        - schemaId
        - schemaSlug
        - eventId
        - createdAt
        - receivedAt
        - occurredAt
        - readyAt
        - readinessState
        - definitionRevision
        - contactId
        - objectId
      properties:
        id: { type: string }
        schemaId: { type: string }
        schemaSlug: { type: string }
        eventId: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        receivedAt:
          type: string
          format: date-time
        occurredAt:
          type: string
          format: date-time
        readyAt:
          type:
            - string
            - "null"
          format: date-time
        readinessState:
          type: string
          enum:
            - pending
            - ready
            - failed
            - outcome_unknown
        definitionRevision:
          type: string
        contactId:
          type:
            - string
            - "null"
        objectId:
          type:
            - string
            - "null"
      additionalProperties: true

    DnsRecord:
      type: object
      required: [type, name, value, priority, status]
      properties:
        type: { type: string }
        name: { type: string }
        value: { type: string }
        priority: { type: [integer, 'null'] }
        status:
          type: string
          enum: [not started, pending, success, failed, temporary failure]

    Domain:
      type: object
      required: [id, createdAt, updatedAt, name, customReturnPath, verificationStarted, verifiedForSending]
      properties:
        id: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        name: { type: string }
        customReturnPath: { type: string }
        verificationStarted: { type: boolean }
        verifiedForSending: { type: boolean }
        records:
          type: array
          description: Live-checked DNS records. Present on `get`, `create`, and `verify`; omitted on `list`.
          items: { $ref: '#/components/schemas/DnsRecord' }

    Sender:
      type: object
      required: [id, createdAt, updatedAt, name, description, code, domainId, email]
      properties:
        id: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        name: { type: string }
        description: { type: [string, 'null'] }
        code: { type: string, description: The email local part. }
        domainId: { type: string }
        email: { type: string, format: email, description: "`code`@domain, derived." }

    Topic:
      type: object
      required: [id, createdAt, updatedAt, name, description, color, channel, private]
      properties:
        id: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        name: { type: string }
        description: { type: [string, 'null'] }
        color: { $ref: '#/components/schemas/BadgeColor' }
        channel: { $ref: '#/components/schemas/CommunicationChannel' }
        private:
          type: boolean
          description: Private topics only appear in the contact preferences page if the contact has been
            granted access.

    Segment:
      type: object
      required:
        [
          id,
          createdAt,
          updatedAt,
          name,
          description,
          contactSchemaId,
          contactSchemaSlug,
          requirements,
          conditionDescriptionMarkdown,
          integrationVendorName
        ]
      properties:
        id: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        name: { type: string }
        description: { type: [string, 'null'] }
        contactSchemaId: { type: string }
        contactSchemaSlug: { type: string }
        requirements:
          type: string
          description: The refined natural-language specification used to generate the condition.
        conditionDescriptionMarkdown:
          type: string
          description: Human-readable markdown description of the condition. The generated expression itself
            is never returned.
        integrationVendorName: { type: [string, 'null'] }
        matchingCount:
          type: integer
          description: >
            Present when the segment was just created, or just updated with new `requirements`;
            omitted otherwise. A live count at that moment, not kept in sync afterward (call
            `segments.count` for the current value).

    SegmentCreate:
      type: object
      required: [name, contactSchema, requirements]
      properties:
        name: { type: string }
        description: { type: [string, 'null'] }
        contactSchema: { type: string, description: A contact schema id or slug. }
        requirements: { type: string, description: Natural-language description of the filter criteria. }

    TemplateFrom:
      description: "A sender: either a verified domain with a manual slug and display name, or a saved
        sender profile."
      oneOf:
        - type: object
          required: [type, domainId, code]
          properties:
            type: { type: string, const: domain }
            domainId: { type: string }
            code: { type: string, description: Email local part. }
            name: { type: [string, 'null'] }
        - type: object
          required: [type, senderId]
          properties:
            type: { type: string, const: sender }
            senderId: { type: string }

    DataPath:
      type: array
      description: A path into a data payload, as property-key segments.
      items: { type: string }

    DataRepresentationProperty:
      description: >
        One property of a data representation. `record` properties reference records from a schema;
        `json` properties are plain JSON values described by a JSON schema. `schema` accepts an id
        or slug on input; responses always echo the slug.
      oneOf:
        - type: object
          required: [key, type, schema]
          properties:
            key: { type: string }
            type: { type: string, const: record }
            schema: { type: string, description: A schema id or slug. }
            isArray: { type: boolean, default: false }
            description: { type: [string, 'null'] }
        - type: object
          required: [key, type, jsonSchema]
          properties:
            key: { type: string }
            type: { type: string, const: json }
            jsonSchema:
              type: object
              description: A simplified JSON Schema describing the value.
            description: { type: [string, 'null'] }

    Template:
      type: object
      required:
        [
          id,
          createdAt,
          updatedAt,
          name,
          description,
          transactional,
          contentFormat,
          contentEditor,
          content,
          from,
          recipientDataPath,
          expectedDataRepresentation,
          communicationTopicId
        ]
      properties:
        id: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        name: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        transactional: { type: boolean }
        contentFormat:
          type: [string, 'null']
          enum: [mjml, html, null]
        contentEditor:
          type: [string, 'null']
          enum: [rich, raw, null]
        content:
          oneOf:
            - type: object
              required: [subject, body]
              properties:
                subject: { type: [string, 'null'] }
                body: { type: [string, 'null'] }
            - type: 'null'
        from:
          oneOf:
            - { $ref: '#/components/schemas/TemplateFrom' }
            - { type: 'null' }
        recipientDataPath: { $ref: '#/components/schemas/DataPath' }
        expectedDataRepresentation:
          type: array
          items: { $ref: '#/components/schemas/DataRepresentationProperty' }
        communicationTopicId: { type: [string, 'null'] }

    TemplateSendRequest:
      type: object
      required: [data]
      properties:
        data:
          type: object
          description: >
            Payload keyed by the template's expected data-representation properties. Minimal
            identifiers suffice for record properties (e.g. `{ "email": "user@example.com" }` for a
            contact); the platform finds-or-creates the record, then reads it back for rendering.
          additionalProperties: true

    TemplateSendResponse:
      type: object
      required: [emailId, status, error]
      properties:
        emailId: { type: [string, 'null'] }
        status:
          type: [string, 'null']
          enum: [sent, failed, null]
        error:
          type: [string, 'null']
          description: A generic message when `status` is `failed`. The real failure detail stays server-side.

    BroadcastSchedulingStatus:
      type: string
      enum: [none, draft, send now, send at]

    BroadcastAudience:
      description: The broadcast's resolved audience.
      oneOf:
        - type: object
          required: [type]
          properties:
            type: { type: string, const: all }
        - type: object
          required: [type, segmentId]
          properties:
            type: { type: string, const: segment }
            segmentId: { type: string }
        - type: object
          required: [type, requirements, conditionDescriptionMarkdown]
          properties:
            type: { type: string, const: custom filter }
            requirements: { type: string }
            conditionDescriptionMarkdown: { type: string }

    BroadcastAudienceInput:
      description: >
        The audience to point a broadcast at: everyone in its contact schema, or an existing
        segment. A `custom filter` audience is authored in the maxclicks app, where a human reviews
        the generated condition before it drives a mass send, and cannot be set here.
      oneOf:
        - type: object
          required: [type]
          properties:
            type: { type: string, const: all }
        - type: object
          required: [type, segmentId]
          properties:
            type: { type: string, const: segment }
            segmentId: { type: string }

    Broadcast:
      type: object
      required:
        [
          id,
          createdAt,
          updatedAt,
          name,
          description,
          contactSchemaId,
          contactSchemaSlug,
          schedulingStatus,
          scheduledFor,
          sendingStartedAt,
          sendingFinishedAt,
          failureReason,
          audience,
          hasContent
        ]
      properties:
        id: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        name: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        contactSchemaId: { type: string }
        contactSchemaSlug: { type: string }
        schedulingStatus: { $ref: '#/components/schemas/BroadcastSchedulingStatus' }
        scheduledFor: { type: [string, 'null'], format: date-time }
        sendingStartedAt: { type: [string, 'null'], format: date-time }
        sendingFinishedAt: { type: [string, 'null'], format: date-time }
        failureReason: { type: [string, 'null'] }
        audience: { $ref: '#/components/schemas/BroadcastAudience' }
        hasContent:
          type: boolean
          description: "Never includes the underlying email content itself (e.g. raw Adaptyle markup), only
            this boolean summary."

    BroadcastUpdate:
      type: object
      description: >
        At least one field must be provided. Only `name`/`description`/ `audience`/`scheduledFor`
        are updatable; content is not editable through this endpoint. Rejected once sending has
        started.
      properties:
        name: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        audience: { $ref: '#/components/schemas/BroadcastAudienceInput' }
        scheduledFor: { type: [string, 'null'], format: date-time }

    BroadcastSendRequest:
      type: object
      description: An empty or omitted body sends now; a `scheduledFor` schedules for later.
      properties:
        scheduledFor: { type: string, format: date-time }

    BroadcastRun:
      type: object
      required: [id, createdAt, contactId, contactEmail, status, failureReason, email]
      properties:
        id: { type: string }
        createdAt: { type: string, format: date-time }
        contactId: { type: string }
        contactEmail: { type: [string, 'null'] }
        status:
          type: string
          enum: [sent, failed, pending]
        failureReason: { type: [string, 'null'] }
        email:
          oneOf:
            - type: object
              required: [id, sentAt, opensCount, clicksCount, bounced, complained]
              properties:
                id: { type: string }
                sentAt: { type: [string, 'null'], format: date-time }
                opensCount: { type: integer }
                clicksCount: { type: integer }
                bounced: { type: boolean }
                complained: { type: boolean }
            - type: 'null'
      description: "A narrow public delivery projection. status is derived from email presence and
        delivery fields: no associated email is reported failed; email sentAt is sent;
        send/rejection error is failed; otherwise pending. This is not the complete internal
        planning, credit, quality-pause, or redrive state. An unsent email object can remain pending
        while operational work waits."

    EmailAggregatedMetrics:
      type: object
      required:
        [
          sent,
          delivered,
          bounced,
          deliveryDelays,
          rejected,
          failed,
          complained,
          unsubscribed,
          opens,
          uniqueOpens,
          clicks,
          uniqueClicks
        ]
      properties:
        sent: { type: integer }
        delivered: { type: integer }
        bounced: { type: integer }
        deliveryDelays: { type: integer }
        rejected: { type: integer }
        failed: { type: integer }
        complained: { type: integer }
        unsubscribed: { type: integer }
        opens: { type: integer }
        uniqueOpens: { type: integer }
        clicks: { type: integer }
        uniqueClicks: { type: integer }

    BroadcastMetricsResponse:
      type: object
      description: "`email` is omitted entirely when the broadcast has no email content yet."
      properties:
        email: { $ref: '#/components/schemas/EmailAggregatedMetrics' }

    WebhookTrigger:
      type: string
      enum:
        - contact upserted
        - contact deleted
        - object upserted
        - object deleted
        - event fired
        - email event

    EmailEventType:
      type: string
      enum:
        - scheduled
        - sending failed
        - sent
        - rejected
        - unsubscribed
        - bounced
        - complained
        - delivered
        - opened
        - clicked
        - delivery delayed

    WebhookStatus:
      type: string
      enum: [live, paused, circuit breaker]

    WebhookCondition:
      description: The webhook's resolved filter condition. The generated expression is never returned,
        only its description.
      oneOf:
        - type: object
          required: [type]
          properties:
            type: { type: string, const: none }
        - type: object
          required: [type, segmentId]
          properties:
            type: { type: string, const: segment }
            segmentId: { type: string }
        - type: object
          required: [type, description]
          properties:
            type: { type: string, const: custom filter }
            description: { type: string }

    WebhookConditionInput:
      description: >
        The filter condition to create or update a webhook with. A `custom filter` condition
        generates via AI from `requirements` (billed, `ai` rate bucket).
      oneOf:
        - type: object
          required: [type]
          properties:
            type: { type: string, const: none }
        - type: object
          required: [type, segmentId]
          properties:
            type: { type: string, const: segment }
            segmentId: { type: string }
        - type: object
          required: [type, requirements]
          properties:
            type: { type: string, const: custom filter }
            requirements:
              type: string
              description: Natural-language description of the filter criteria.

    Webhook:
      type: object
      required:
        - id
        - createdAt
        - updatedAt
        - url
        - trigger
        - emailEventTypes
        - schemaId
        - condition
        - status
        - totalCalls
        - failedCalls
        - failedCallsInARow
        - lastCalledAt
        - lastCallErrorMessage
        - integrationVendorName
      properties:
        id: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        url: { type: string, format: uri }
        trigger: { $ref: '#/components/schemas/WebhookTrigger' }
        emailEventTypes:
          type: array
          items: { $ref: '#/components/schemas/EmailEventType' }
        schemaId: { type: [string, 'null'] }
        condition: { $ref: '#/components/schemas/WebhookCondition' }
        status: { $ref: '#/components/schemas/WebhookStatus' }
        totalCalls: { type: integer }
        failedCalls: { type: integer }
        failedCallsInARow: { type: integer }
        lastCalledAt: { type: [string, 'null'], format: date-time }
        lastCallErrorMessage: { type: [string, 'null'] }
        integrationVendorName:
          type: [string, 'null']
          description: Non-null means the webhook is integration-owned and cannot be updated, deleted, or
            rotated.

    WebhookWithSecret:
      allOf:
        - { $ref: '#/components/schemas/Webhook' }
        - type: object
          required: [signatureVerificationSecret]
          properties:
            signatureVerificationSecret: { type: string }

    WebhookCreate:
      type: object
      required: [url, trigger]
      properties:
        url: { type: string, format: uri }
        trigger: { $ref: '#/components/schemas/WebhookTrigger' }
        emailEventTypes:
          type: array
          description: Required and non-empty only when trigger is `email event`.
          items: { $ref: '#/components/schemas/EmailEventType' }
        schemaId:
          type: [string, 'null']
          description: A schema id or slug. Required for every trigger except `email event`.
        condition:
          $ref: '#/components/schemas/WebhookConditionInput'

    WebhookUpdate:
      type: object
      description: At least one field must be provided. Trigger and schema are not updatable.
      properties:
        url: { type: string, format: uri }
        emailEventTypes:
          type: array
          items: { $ref: '#/components/schemas/EmailEventType' }
        condition: { $ref: '#/components/schemas/WebhookConditionInput' }
        status:
          type: string
          enum: [live, paused]

    RotatedWebhookSecret:
      type: object
      required: [id, signatureVerificationSecret, updatedAt]
      properties:
        id: { type: string }
        signatureVerificationSecret: { type: string }
        updatedAt: { type: string, format: date-time }

    Workflow:
      type: object
      required: [id, createdAt, updatedAt, name, description, paused, isDirty, published]
      properties:
        id: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        name: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        paused: { type: boolean }
        isDirty: { type: boolean, description: Has unpublished changes. }
        published: { type: boolean }

    WorkflowRunStepHistoryRecord:
      type: object
      required:
        - index
        - stepId
        - stepLabel
        - slotKey
        - enteredAt
        - leftAt
        - failureReason
      properties:
        stepId: { type: string }
        stepLabel: { type: [string, 'null'] }
        slotKey: { type: [string, 'null'] }
        enteredAt: { type: string, format: date-time }
        leftAt: { type: string, format: date-time }
        failureReason: { type: [string, 'null'] }
        index:
          type: integer

    WorkflowRun:
      type: object
      required:
        - id
        - createdAt
        - updatedAt
        - versionId
        - status
        - failureReason
        - stepHistory
        - stepCount
        - parentRunId
        - parentExecutionOrdinal
        - nextHistoryBeforeIndex
      properties:
        id: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        versionId: { type: string }
        status:
          type: string
          enum: [running, completed, failed]
        failureReason: { type: [string, 'null'] }
        stepHistory:
          type: array
          items: { $ref: '#/components/schemas/WorkflowRunStepHistoryRecord' }
        stepCount:
          type: integer
          description: Persisted execution ordinal; not the length of this history window.
        parentRunId:
          type:
            - string
            - "null"
        parentExecutionOrdinal:
          type:
            - integer
            - "null"
        nextHistoryBeforeIndex:
          type:
            - integer
            - "null"
          description: Pass as history_before to get earlier history; null when no earlier cursor is available.
      example:
        id: wfr_BcwDvBUeSaSDILA5tHgpmU7I
        createdAt: 2026-09-14T10:30:00.000Z
        updatedAt: 2026-09-14T10:30:01.000Z
        versionId: wfv_BcwDvBUeSaSDILA5tHgpmU7I
        status: running
        failureReason: null
        stepHistory:
          - index: 0
            stepId: wfs_BcwDvBUeSaSDILA5tHgpmU7I
            stepLabel: Incoming webhook
            slotKey: next
            enteredAt: 2026-09-14T10:30:00.000Z
            leftAt: 2026-09-14T10:30:01.000Z
            failureReason: null
        stepCount: 1
        parentRunId: null
        parentExecutionOrdinal: null
        nextHistoryBeforeIndex: null

    FormContactInput:
      type: object
      description: Flat contact input for the form's contact schema. Custom attribute keys are passed at
        the top level.
      properties:
        id: { type: [string, 'null'] }
        fullName: { type: [string, 'null'] }
        firstName: { type: [string, 'null'] }
        lastName: { type: [string, 'null'] }
        avatarUrl: { type: [string, 'null'] }
        userId: { type: [string, 'null'] }
        email: { type: [string, 'null'], format: email }
        phone: { type: [string, 'null'] }
        notes: { type: [string, 'null'] }
        tags:
          type: [array, 'null']
          items: { type: string }
      additionalProperties: true

    FormSubmission:
      type: object
      required: [contact]
      properties:
        submissionId:
          type: string
          pattern: '^rpi1\.[0-9]{13}\.[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
          description: >-
            Stable ID for one input, required when direct contact creation needs AI auto-fill.
            Format rpi1.<Unix milliseconds>.<UUIDv4>. Keep the original ID with the original input
            for retries. The recovery window is 24 hours rounded up to the next minute.
        contact: { $ref: '#/components/schemas/FormContactInput' }
        emailMarketingConsent: { type: [boolean, 'null'] }
        captchaToken: { type: [string, 'null'] }

    FormSubmissionResult:
      oneOf:
        - type: object
          required: [contactId]
          properties:
            contactId: { type: string }
        - type: object
          required: [status]
          properties:
            status: { type: string, const: verification_pending }
    RecordDeletionStatus:
      type: object
      required:
        - operationId
        - status
        - canCancel
        - message
      properties:
        operationId:
          type: string
          description: Opaque deletion operation identifier. Preserve the whole value.
        status:
          type: string
          enum:
            - pending
            - blocked
            - completed
            - cancelled
        canCancel:
          type: boolean
          description: Advisory cancellation flag. The public status read returns false; the cancellation route validates current requester, write permission and phase independently.
        message:
          type: string
      example:
        operationId: delete:records:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        status: pending
        canCancel: false
        message: Record deletion is in progress.
    EventStatus:
      type: object
      required:
        - id
        - eventId
        - receivedAt
        - occurredAt
        - readyAt
        - readinessState
        - definitionRevision
        - contactId
        - objectId
        - data
      properties:
        id:
          type: string
        eventId:
          type:
            - string
            - "null"
        receivedAt:
          type: string
          format: date-time
        occurredAt:
          type: string
          format: date-time
        readyAt:
          type:
            - string
            - "null"
          format: date-time
        readinessState:
          type: string
          enum:
            - pending
            - ready
            - failed
            - outcome_unknown
        definitionRevision:
          type: string
        contactId:
          type:
            - string
            - "null"
        objectId:
          type:
            - string
            - "null"
        data:
          type: object
          additionalProperties: true
          description: Raw accepted input until readiness; prepared data when ready.
      example:
        id: ev_BcwDvBUeSaSDILA5tHgpmU7I
        eventId: order_1042_paid
        receivedAt: 2026-09-14T10:30:00.000Z
        occurredAt: 2026-09-14T10:30:00.000Z
        readyAt: null
        readinessState: pending
        definitionRevision: f2d9685136d4746456815a2b8a6d7a3f9eba98dfc4d6129497778d5037410d7a
        contactId: null
        objectId: null
        data:
          amount: 42
    EventIdentityInput:
      type: object
      additionalProperties: false
      required:
        - sourceId
        - subjectSchemaId
        - anonymousId
        - contactId
        - operationId
        - expectedAliasRevision
      properties:
        sourceId:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$
          description: Source id matching an enabled contact track definition.
          example: source_website
        subjectSchemaId:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$
          description: Contact schema id (not a slug) used by the track.
          example: sch_BcwDvBUeSaSDILA5tHgpmU7I
        anonymousId:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$
          description: Browser identity in the configured source.
          example: visitor_1042
        contactId:
          type:
            - string
            - "null"
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$
          description: Contact in the subject schema, or null to unbind.
          example: con_BcwDvBUeSaSDILA5tHgpmU7I
        operationId:
          type: string
          format: uuid
          description: Stable UUID for this identity change; reuse the same body on retries.
          example: e125aecb-8b4e-4c7e-8f08-8f768bced7ab
        expectedAliasRevision:
          type: string
          pattern: ^(0|[1-9][0-9]{0,17})$
          description: Last known revision for this alias. Use "0" only for a new alias.
          example: "0"
    EventIdentityResult:
      type: object
      required:
        - identityRevision
        - affectedSubjectIds
        - isDuplicate
      properties:
        identityRevision:
          type: string
          description: Committed revision as a decimal string; do not coerce to a floating-point number.
        affectedSubjectIds:
          type: array
          items:
            type: string
          description: Previous and new bound contacts whose track results can change.
        isDuplicate:
          type: boolean
    IdempotencyUnknownError:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              const: idempotency_outcome_unknown
            message:
              type: string
            operationId:
              type: string
            type:
              type: string
              description: May be omitted on a persistence failure.
