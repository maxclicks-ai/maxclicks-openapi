      responses:
        '200':
          description: The suppression.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Suppression' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [Suppressions]
      summary: Delete a suppression
      description: >
        Removes a suppression, re-allowing communication to that identifier.
        Requires an admin key. Not Idempotency-Key aware. Errors:
        `suppression_not_found`, `suppression_reason_not_removable` (403, a
        system-applied reason such as a hard bounce, not `manual`/`legal`).
      operationId: suppressions.delete
      responses:
        '200':
          description: The suppression was removed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletedEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
