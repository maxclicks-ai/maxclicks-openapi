        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [Workflows]
      summary: Delete a workflow
      description: "Hard delete. Error: `workflow_not_found`."
      operationId: workflows.delete
      parameters:
        - name: id
          in: path
          required: true
          description: The workflow id.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The workflow was deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletedEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Workflows]
      summary: Trigger a workflow
      description: >
        Starts a workflow run from a published incoming-webhook step. The
        path segment is the step's `workflowStepReference`, not a workflow id
        (this is the router's catch-all trigger route; see the note on this path
        item). The body is arbitrary JSON validated server-side against the
        step's configured JSON schema. On success returns an empty object. Read
        permission only (intentionally, despite the write side effects). Supports
        `Idempotency-Key`, the recommended way to make retried external webhook
        deliveries safe. Note: failures from the workflow handler are returned as
        `text/plain`, while authentication failures use the JSON error envelope.
        Errors: `workflow_step_not_found` (404, covers a missing/duplicate/
        unpublished step and a paused workflow, indistinguishable from
        not-found here), `invalid_request_body` (400, body fails the step's JSON
        schema).
      operationId: workflows.trigger
      parameters:
        - name: id
          in: path
          required: true
          description: The incoming-webhook step's reference id.
          schema: { type: string }
        - { $ref: '#/components/parameters/IdempotencyKeyParam' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Per-workflow-step payload, validated against the step's JSON schema.
              additionalProperties: true
      responses:
        '200':
          description: The workflow run was started.
          headers:
            Idempotent-Replay: { $ref: '#/components/headers/IdempotentReplay' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                description: "`data` is an empty object."
                properties:
                  data: { type: object }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '400':
          description: The body failed the step's JSON schema, or the schema is invalid.
          content:
            text/plain:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No matching, published incoming-webhook step for this reference.
          content:
            text/plain:
              schema: { type: string }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500':
          description: Server error.
          content:
            text/plain:
              schema: { type: string }

  /workflows/{id}/pause:
    parameters:
      - { $ref: '#/components/parameters/WorkflowIdParam' }
    post:
      tags: [Workflows]
      summary: Pause a workflow
      description: >
        Stops new runs from starting; runs already in flight finish normally.
        Error: `workflow_not_found`.
      operationId: workflows.pause
      responses:
        '200':
          description: The paused workflow.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Workflow' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /workflows/{id}/unpause:
    parameters:
      - { $ref: '#/components/parameters/WorkflowIdParam' }
    post:
      tags: [Workflows]
      summary: Unpause a workflow
      description: "Error: `workflow_not_found`."
      operationId: workflows.unpause
      responses:
        '200':
          description: The unpaused workflow.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Workflow' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /workflows/{id}/runs:
    parameters:
      - { $ref: '#/components/parameters/WorkflowIdParam' }
    get:
      tags: [Workflows]
      summary: List a workflow's runs
      description: "Error: `workflow_not_found`."
      operationId: workflows.listRuns
      parameters:
        - { $ref: '#/components/parameters/LimitParam' }
        - { $ref: '#/components/parameters/OffsetParam' }
      responses:
        '200':
          description: A page of workflow runs.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/WorkflowRun' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /workflows/{id}/runs/{runId}:
    parameters:
      - { $ref: '#/components/parameters/WorkflowIdParam' }
      - name: runId
        in: path
        required: true
        description: The workflow run id.
        schema: { type: string, format: uuid }
    get:
      tags: [Workflows]
      summary: Get a workflow run
      description: "Errors: `workflow_not_found`, `workflow_run_not_found`."
      operationId: workflows.getRun
      responses:
        '200':
          description: The workflow run.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/WorkflowRun' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api-keys:
    get:
      tags: [API Keys]
      summary: List API keys
      description: Requires an admin key.
      operationId: apiKeys.list
      parameters:
        - { $ref: '#/components/parameters/LimitParam' }
        - { $ref: '#/components/parameters/OffsetParam' }
      responses:
        '200':
          description: A page of API keys.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ApiKey' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [API Keys]
      summary: Create an API key
      description: >
        Returns the plaintext key, shown exactly once; only `keyDisplay` (a
        masked preview) is ever returned again. Requires an admin key. Not
        Idempotency-Key aware (secret-returning). Error: `invalid_api_key_name`.
      operationId: apiKeys.create
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiKeyCreate' }
      responses:
        '201':
          description: The created API key, including its plaintext value.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ApiKeyWithSecret' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api-keys/{id}:
    parameters:
      - { $ref: '#/components/parameters/ApiKeyIdParam' }
    delete:
      tags: [API Keys]
      summary: Delete an API key
      description: "Requires an admin key. Error: `api_key_not_found`."
      operationId: apiKeys.delete
      responses:
        '200':
          description: The API key was deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletedEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /forms/{formId}/submit:
    parameters:
      - { $ref: '#/components/parameters/FormIdParam' }
    post:
      tags: [Forms]
      summary: Submit a form
      description: >
        Public, unauthenticated form submission (the tenant is derived from the
        form, not an API key). Validates required fields, CAPTCHA, and consent,
        then upserts the contact or (for double opt-in, when the visitor opted in
        to email) stores a pending record and emails a confirmation link. A
        declined-consent submission always goes through the direct path even on a
        double opt-in form. Rate limits: per IP 10/60s and per form 120/60s (both
        fail open if Redis is down), plus a separate per-recipient/per-form cap on
        confirmation emails. Error: `rate_limit_exceeded`.
      operationId: forms.submit
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FormSubmission' }
      responses:
        '200':
          description: The submission was accepted.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/FormSubmissionResult' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /forms/{formId}/confirm/{token}:
    parameters:
      - { $ref: '#/components/parameters/FormIdParam' }
      - name: token
        in: path
        required: true
        description: The single-use double opt-in token from the confirmation email.
        schema: { type: string }
    get:
      tags: [Forms]
      summary: Confirm a double opt-in
      description: >
        Public browser navigation target for the double opt-in email link.
        Redeems the token, upserts the confirmed contact, and always redirects
        (302) to the hosted result page. Every failure path (missing/expired
        token, unpublished form) also redirects to a "failed" landing page rather
        than returning a JSON error. Same rate limits as `forms.submit`.
      operationId: forms.confirmDoubleOptIn
      security: []
      responses:
        '302':
          description: Redirect to the hosted confirmation result page.
          headers:
            Location:
              description: The result page URL.
              schema: { type: string, format: uri }

  /emails/{emailId}/unsubscribe:
    parameters:
      - name: emailId
        in: path
        required: true
        description: The id of the sent email.
        schema: { type: string }
    post:
      tags: [Emails]
      summary: One-click unsubscribe
      description: >
        Public RFC 8058 one-click unsubscribe target. Unsubscribes the linked
        contact from a topic or the whole email channel, then redirects (302) to
        the hosted result page. No rate limit at all on this endpoint.
      operationId: emails.unsubscribeOneClick
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [List-Unsubscribe]
              properties:
                List-Unsubscribe:
                  type: string
                  const: One-Click
      responses:
        '302':
          description: Redirect to the hosted unsubscribe result page.
          headers:
            Location:
              description: The result page URL.
              schema: { type: string, format: uri }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Your API key sent as a bearer token in the `Authorization` header:
        `Authorization: Bearer <api_key>`. The server also accepts the raw key
        without the `Bearer ` prefix, but clients should always send `Bearer`.

  headers:
    IdempotentReplay:
      description: >
        Present and `true` when this response was replayed verbatim from a
        prior request that used the same `Idempotency-Key`.
      schema: { type: boolean }

  parameters:
    LimitParam:
      name: limit
      in: query
      required: false
      description: Page size. Clamped to 1..200 with a warning if out of range.
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 200
    OffsetParam:
      name: offset
      in: query
      required: false
      description: >
        Rows to skip. Values below 0 are clamped to 0 with a warning. A value
        above 10000 is rejected outright with `400 offset_too_large` rather than
        clamped, so a client cannot silently loop forever past the cap; narrow
        the query instead of paging past it.
      schema:
        type: integer
        default: 0
        minimum: 0
        maximum: 10000
    IdempotencyKeyParam:
      name: Idempotency-Key
      in: header
      required: false
      description: >
        A client-generated key that makes retries of this request safe. See the
        Idempotency-Key section of the top-level description.
      schema: { type: string }
    SchemaParam:
      name: schema
      in: path
      required: true
      description: A schema id or slug.
      schema: { type: string }
    RecordIdParam:
      name: id
      in: path
      required: true
      description: The record's platform id.
      schema: { type: string, format: uuid }
    ImportIdParam:
      name: id
      in: path
      required: true
      description: The import id.
      schema: { type: string, format: uuid }
    SuppressionIdParam:
      name: id
      in: path
      required: true
      description: The suppression id.
      schema: { type: string }
    DomainIdParam:
      name: id
      in: path
      required: true
      description: The domain id.
      schema: { type: string, format: uuid }
    SenderIdParam:
      name: id
      in: path
      required: true
      description: The sender id.
      schema: { type: string, format: uuid }
    TopicIdParam:
      name: id
      in: path
      required: true
      description: The topic id.
      schema: { type: string, format: uuid }
    SegmentIdParam:
      name: id
      in: path
      required: true
      description: The segment id.
      schema: { type: string, format: uuid }
    BroadcastIdParam:
      name: id
      in: path
      required: true
      description: The broadcast id.
      schema: { type: string, format: uuid }
    TemplateIdParam:
      name: id
      in: path
      required: true
      description: The template id.
      schema: { type: string, format: uuid }
    WebhookIdParam:
      name: id
      in: path
      required: true
      description: The webhook id.
      schema: { type: string, format: uuid }
    WorkflowIdParam:
      name: id
      in: path
      required: true
      description: The workflow id.
      schema: { type: string, format: uuid }
    ApiKeyIdParam:
      name: id
      in: path
      required: true
      description: The API key id.
      schema: { type: string, format: uuid }
    FormIdParam:
      name: formId
      in: path
      required: true
      description: The form id.
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: >
        The request was malformed or failed validation. Also covers
        `malformed_json` (body is not valid JSON) and, on list endpoints,
        `offset_too_large`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: The API key is missing or invalid.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: The key lacks permission, or the space is out of scope.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: The referenced resource was not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: The write conflicts with an existing resource or the resource's current state.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PaymentRequired:
      description: >
        Insufficient credits (`insufficient_credits`) for an AI-generation call
        or a schema with AI auto-fill, or the space's email allowance is
        exhausted (`email_limit_reached`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UnprocessableEntity:
      description: >
        The request was well-formed but could not be processed, typically a
        failed AI-generation call or a readiness gate (which may carry
        `error.issues`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: The rate limit was exceeded.
      headers:
        Retry-After:
          description: When to retry, as an HTTP date.
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PayloadTooLarge:
      description: The request body exceeds the 10 MB limit.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UnsupportedMediaType:
      description: The request used an unsupported content type, charset, or content encoding.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    IngestUnavailable:
      description: >
        A downstream event dependency is unavailable: the ingest pipeline
        (`ingest_unavailable`, on `events.fire`/`events.fireBatch`) or the
        ClickHouse-backed event archive (`event_archive_unavailable`, on
        `events.get`/`events.list`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServerError:
      description: The API failed to process a valid request.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    ErrorObject:
      type: object
      required: [type, code, message]
      properties:
        type:
          type: string
          enum: [invalid_request_error, api_error]
        code:
          type: [string, 'null']
          description: A stable machine-readable code, or null.
        message:
          type: string
        issues:
          type: array
          description: >
            Present only for validation-gate failures that report more than one
            distinct problem at once (e.g. `broadcasts.send`'s `broadcast_invalid`).
          items: { type: string }

    Error:
      type: object
      required: [error]
      properties:
        error: { $ref: '#/components/schemas/ErrorObject' }

    Warnings:
      type: array
      description: Non-fatal warnings accumulated while processing the request.
      items: { type: string }

    Pagination:
      type: object
      required: [limit, offset, totalCount, hasMore]
      properties:
        limit: { type: integer }
        offset: { type: integer }
        totalCount: { type: integer }
        hasMore: { type: boolean }

    CursorPagination:
      type: object
      description: Cursor pagination envelope, used only by `events.list`.
      required: [limit, nextCursor, hasMore]
      properties:
        limit: { type: integer }
        nextCursor:
          type: [string, 'null']
          description: Opaque cursor for the next page, or null when there are no more rows.
        hasMore: { type: boolean }

    Deleted:
      type: object
      required: [id, deleted]
      properties:
        id: { type: string }
        deleted: { type: boolean, const: true }

    DeletedEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Deleted' }
        warnings: { $ref: '#/components/schemas/Warnings' }

    RecordEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Record' }
        warnings: { $ref: '#/components/schemas/Warnings' }

    SchemaType:
      type: string
      enum: [contact, object, event]

    ContactSource:
      type: string
      enum: [import, api, form, manual, workflow, integration]

    CommunicationChannel:
      type: string
      enum: [email]

    BadgeColor:
      type: string
      description: A display color for tags and topics.
      enum:
        [red, orange, amber, yellow, lime, green, emerald, teal, cyan, sky, blue, indigo, violet, purple, fuchsia, pink, rose, zinc]

    SuppressionReason:
      type: string
      description: >
        All possible suppression reasons on read. Only `manual` and `legal` can
        be created or removed through the API; the rest are system-applied
        (bounce, complaint, unsubscribe) and read-only.
      enum: [manual, legal, unsubscribed, hard_bounce, soft_bounce_consecutive, spam_complaint]

    SuppressionCreateReason:
      type: string
      enum: [manual, legal]

    RoleName:
      type: string
      enum: [admin, non-paid admin, member]

    Me:
      type: object
      required: [apiKey, user, space, role]
      properties:
        apiKey:
          type: object
          required: [id, name, keyDisplay, createdAt]
          properties:
            id: { type: string }
            name: { type: [string, 'null'] }
            keyDisplay: { type: string }
            createdAt: { type: string, format: date-time }
        user:
          type: object
          required: [id, email, name]
          properties:
            id: { type: string }
            email: { type: string, format: email }
            name: { type: [string, 'null'] }
        space:
          type: [object, 'null']
          properties:
            id: { type: string }
            slug: { type: string }
            name: { type: string }
        role:
          type: [object, 'null']
          properties:
            name: { $ref: '#/components/schemas/RoleName' }
            label: { type: string }
            description: { type: string }

    Schema:
      type: object
      required:
        [id, type, slug, name, namePlural, description, integrationVendorName, attributeCount, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/SchemaType' }
        slug: { type: string }
        name: { type: string }
        namePlural: { type: string }
        description: { type: [string, 'null'] }
        integrationVendorName: { type: [string, 'null'] }
        attributeCount:
          type: integer
          description: Count of custom attribute rows only (base attributes excluded).
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SchemaCreate:
      type: object
      required: [type, name, namePlural, slug]
      properties:
        type: { $ref: '#/components/schemas/SchemaType' }
        name: { type: string }
        namePlural: { type: string }
        slug: { type: string }
        description: { type: [string, 'null'] }

    SchemaUpdate:
      type: object
      description: At least one field must be provided. `type` and `slug` are immutable.
      properties:
        name: { type: string }
        namePlural: { type: string }
        description: { type: [string, 'null'] }

    AttributeDefinition:
      type: object
      description: >
        A stored or evaluated attribute definition. The `type` discriminates the
        shape. Stored types include string, number, decimal, boolean, date time,
        date only, time only, url, email, phone, json, string array, object, and
        object array. `evaluated` attributes are computed and never stored; their
        generated expression is never returned. Additional properties vary by
        type and sub-format.
      required: [type]
      properties:
        type: { type: string }
      additionalProperties: true

    Attribute:
      type: object
      required: [id, key, label, description, sequence, definition, integrationVendorName, createdAt, updatedAt]
      properties:
        id:
          type: string
          description: A custom attribute id, or `base:<key>` for platform base attributes.
        key: { type: string }
        label: { type: string }
        description: { type: [string, 'null'] }
        sequence:
          type: [string, 'null']
          description: Ordering value for custom attributes; null for base attributes.
        definition: { $ref: '#/components/schemas/AttributeDefinition' }
        integrationVendorName: { type: [string, 'null'] }
        createdAt: { type: [string, 'null'], format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }

    AttributeCreate:
      type: object
      required: [key, label]
      description: Provide exactly one of `definition` or `requirements`.
      properties:
        key: { type: string, description: "1-100 chars, no spaces or quotes, not a reserved base key." }
        label: { type: string }
        description: { type: [string, 'null'] }
        definition:
          description: A stored attribute definition. Cannot be `evaluated`; use `requirements` for that.
          allOf: [{ $ref: '#/components/schemas/AttributeDefinition' }]
        requirements:
          type: string
          description: >
            Natural-language prompt. AI generates an evaluated attribute
            definition from it (billed, `ai` rate bucket).

    EmailStatistics:
      type: object
      required: [sent, delivered, bounced, complained, unsubscribed, uniqueOpens, uniqueClicks]
      properties:
        sent: { type: integer }
        delivered: { type: integer }
        bounced: { type: integer }
        complained: { type: integer }
        unsubscribed: { type: integer }
        uniqueOpens: { type: integer }
        uniqueClicks: { type: integer }

    ContactRecord:
      type: object
      description: A contact record. Custom attribute values are spread onto the top level.
      required:
        - id
        - schemaId
        - schemaSlug
        - source
        - fullName
        - firstName
        - lastName
        - avatarUrl
        - userId
        - email
        - phone
        - subscriptions
        - topicIds
        - notes
        - tags
        - emailStatistics
        - createdAt
        - updatedAt
      properties:
        id: { type: string, format: uuid }
        schemaId: { type: string, format: uuid }
        schemaSlug: { type: string }
        source: { $ref: '#/components/schemas/ContactSource' }
        fullName: { type: [string, 'null'] }
        firstName: { type: [string, 'null'] }
        lastName: { type: [string, 'null'] }
        avatarUrl: { type: [string, 'null'] }
        userId: { type: [string, 'null'] }
        email: { type: [string, 'null'], format: email }
        phone: { type: [string, 'null'] }
        subscriptions:
          type: array
          items: { $ref: '#/components/schemas/CommunicationChannel' }
        topicIds:
          type: array
          items: { type: string }
        notes: { type: [string, 'null'] }
        tags:
          type: array
          items: { type: string }
        emailStatistics:
          oneOf:
            - { $ref: '#/components/schemas/EmailStatistics' }
            - { type: 'null' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      additionalProperties: true

    ObjectRecord:
      type: object
      description: An object record. Custom attribute values are spread onto the top level.
      required: [id, schemaId, schemaSlug, externalId, notes, tags, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        schemaId: { type: string, format: uuid }
        schemaSlug: { type: string }
        externalId: { type: [string, 'null'] }
        notes: { type: [string, 'null'] }
        tags:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      additionalProperties: true

    Record:
      description: A contact or object record.
      oneOf:
        - { $ref: '#/components/schemas/ContactRecord' }
        - { $ref: '#/components/schemas/ObjectRecord' }

    RecordInput:
      type: object
      description: >
        Input for creating, upserting, or updating a record. All fields are
        optional. For a contact schema the contact fields apply; for an object
        schema the object fields apply. Custom attribute keys are passed at the
        top level.
      properties:
        id: { type: string }
        fullName: { type: [string, 'null'] }
        firstName: { type: [string, 'null'] }
        lastName: { type: [string, 'null'] }
        avatarUrl: { type: [string, 'null'] }
        userId: { type: [string, 'null'] }
        email: { type: [string, 'null'], format: email }
        phone: { type: [string, 'null'] }
        subscriptions:
          type: array
          items: { $ref: '#/components/schemas/CommunicationChannel' }
        topicIds:
          type: array
          items: { type: string }
        externalId: { type: [string, 'null'] }
        notes: { type: [string, 'null'] }
        tags:
          type: array
          items: { type: string }
      additionalProperties: true

    AuditTrailEntry:
      type: object
      required:
        - id
        - createdAt
        - communicationChannel
        - communicationTopicIds
        - eventType
        - state
        - optInLevel
        - actorType
        - actorIdentifier
        - context
      properties:
        id: { type: string }
        createdAt: { type: string, format: date-time }
        communicationChannel: { $ref: '#/components/schemas/CommunicationChannel' }
        communicationTopicIds:
          type: array
          items: { type: string }
        eventType:
          type: string
          enum:
            - email_verification_sent
            - email_verified
            - phone_verification_sent
            - phone_verified
            - subscribed
            - unsubscribed
            - topics_added
            - topics_removed
            - suppressed
            - unsuppressed
        state:
          type: [string, 'null']
          enum: [subscribed, not_subscribed, unsubscribed, pending, invalid, redacted, null]
        optInLevel:
          type: [string, 'null']
          enum: [single, double, unknown, null]
        actorType:
          type: string
          enum: [contact, admin, system, api]
        actorIdentifier: { type: [string, 'null'] }
        context:
          description: >
            Raw JSON context (consent text/version, IP, user agent, source URL,
            form id, timestamp). `ipAddress` and `userAgent` are stripped before
            being returned.

    SuppressionInput:
      type: object
      required: [identifier, reason]
      properties:
        identifier:
          type: string
          format: email
          description: The email address to suppress.
        reason: { $ref: '#/components/schemas/SuppressionCreateReason' }
        notes: { type: [string, 'null'] }

    Suppression:
      type: object
      required: [id, createdAt, communicationChannel, reason, notes, scope, identifierHash]
      properties:
        id: { type: string }
        createdAt: { type: string, format: date-time }
        communicationChannel: { $ref: '#/components/schemas/CommunicationChannel' }
        reason: { $ref: '#/components/schemas/SuppressionReason' }
        notes: { type: [string, 'null'] }
        scope:
          type: string
          enum: [space, global]
        identifierHash:
          type: string
          description: A hash of the suppressed identifier. The raw identifier is never returned.
        affectedContactCount:
          type: integer
          description: >
            Present only on `suppressions.create` and `suppressions.batchCreate`
            responses: contacts in the space whose identifier matched.

    SuppressionBatchCreateRequest:
      type: object
      required: [suppressions]
      properties:
        suppressions:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/SuppressionInput' }

    SuppressionBatchCreateResultItem:
      type: object
      required: [index, status]
      description: >
        Suppression fields are present when `status` is `created` or `exists`;
        `error` is present when `status` is `failed`.
      allOf:
        - type: object
          properties:
            index: { type: integer }
            status:
              type: string
              enum: [created, exists, failed]
            error: { $ref: '#/components/schemas/ErrorObject' }
        - $ref: '#/components/schemas/Suppression'

    SuppressionBatchCreateResult:
      type: object
      required: [results, summary]
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/SuppressionBatchCreateResultItem' }
        summary:
          type: object
          required: [created, exists, failed]
          properties:
            created: { type: integer }
            exists: { type: integer }
            failed: { type: integer }

    SuppressionBatchDeleteRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string }

    SuppressionBatchDeleteResultItem:
      type: object
      required: [index, status]
      properties:
        index: { type: integer }
        status:
          type: string
          enum: [removed, failed]
        error: { $ref: '#/components/schemas/ErrorObject' }

    SuppressionBatchDeleteResult:
      type: object
      required: [results, summary]
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/SuppressionBatchDeleteResultItem' }
        summary:
          type: object
          required: [removed, failed]
          properties:
            removed: { type: integer }
            failed: { type: integer }

    EventInput:
      type: object
      description: A flat event input. Any `id` is ignored on fire. Custom attribute keys are passed at the top level.
      properties:
        eventId:
          type: [string, 'null']
          description: Deduplication key.
        occurredAt:
          type: string
          format: date-time
          description: When the event actually happened.
      additionalProperties: true

    FireResult:
      type: object
      required: [accepted]
      properties:
        accepted:
          type: integer
          description: Number of events accepted by the ingest pipeline.

    BatchFireItemResult:
      type: object
      required: [index, status]
      properties:
        index: { type: integer }
        status:
          type: string
          enum: [accepted, failed]
        error: { $ref: '#/components/schemas/ErrorObject' }

    BatchFireResult:
      type: object
      required: [results, summary]
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/BatchFireItemResult' }
        summary:
          type: object
          required: [accepted, failed]
          properties:
            accepted: { type: integer }
            failed: { type: integer }
        failedIndex:
          type: integer
          description: Present only on an abort response, pointing at the first invalid item.

    EventBatchRequest:
      type: object
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/EventInput' }
        onError:
          type: string
          enum: [continue, abort]
          default: continue

    Event:
      type: object
      description: A fired event. Custom attribute values are spread onto the top level.
      required: [id, schemaId, schemaSlug, eventId, createdAt]
      properties:
        id: { type: string, format: uuid }
        schemaId: { type: string, format: uuid }
        schemaSlug: { type: string }
        eventId: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
      additionalProperties: true

    DnsRecord:
      type: object
      required: [type, name, value, priority, status]
      properties:
        type: { type: string }
        name: { type: string }
        value: { type: string }
        priority: { type: [integer, 'null'] }
        status:
          type: string
          enum: [not started, pending, success, failed, temporary failure]

    Domain:
      type: object
      required: [id, createdAt, updatedAt, name, customReturnPath, verificationStarted, verifiedForSending]
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        name: { type: string }
        customReturnPath: { type: string }
        verificationStarted: { type: boolean }
        verifiedForSending: { type: boolean }
        records:
          type: array
          description: Live-checked DNS records. Present on `get`, `create`, and `verify`; omitted on `list`.
          items: { $ref: '#/components/schemas/DnsRecord' }

    DomainCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, description: "The domain name, e.g. example.com." }
        customReturnPath:
          type: string
          default: send
          description: The bounce-handling subdomain label.

    Sender:
      type: object
      required: [id, createdAt, updatedAt, name, description, code, domainId, email]
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        name: { type: string }
        description: { type: [string, 'null'] }
        code: { type: string, description: The email local part. }
        domainId: { type: string }
        email: { type: string, format: email, description: "`code`@domain, derived." }

    SenderCreate:
      type: object
      required: [name, code, domainId]
      properties:
        name: { type: string }
        description: { type: [string, 'null'] }
        code: { type: string }
        domainId: { type: string }

    SenderUpdate:
      type: object
      description: At least one field must be provided.
      properties:
        name: { type: string }
        description: { type: [string, 'null'] }
        code: { type: string }
        domainId: { type: string }

    Topic:
      type: object
      required: [id, createdAt, updatedAt, name, description, color, channel, private]
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        name: { type: string }
        description: { type: [string, 'null'] }
        color: { $ref: '#/components/schemas/BadgeColor' }
        channel: { $ref: '#/components/schemas/CommunicationChannel' }
        private:
          type: boolean
          description: Private topics only appear in the contact preferences page if the contact has been granted access.

    TopicCreate:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: [string, 'null'] }
        color: { $ref: '#/components/schemas/BadgeColor' }
        channel:
          $ref: '#/components/schemas/CommunicationChannel'
        private: { type: boolean, default: false }

    TopicUpdate:
      type: object
      description: At least one field must be provided. `channel` is immutable.
      properties:
        name: { type: string }
        description: { type: [string, 'null'] }
        color: { $ref: '#/components/schemas/BadgeColor' }
        private: { type: boolean }

    Segment:
      type: object
      required:
        [id, createdAt, updatedAt, name, description, contactSchemaId, contactSchemaSlug, requirements, conditionDescriptionMarkdown, integrationVendorName]
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        name: { type: string }
        description: { type: [string, 'null'] }
        contactSchemaId: { type: string }
        contactSchemaSlug: { type: string }
        requirements:
          type: string
          description: The refined natural-language specification used to generate the condition.
        conditionDescriptionMarkdown:
          type: string
          description: Human-readable markdown description of the condition. The generated expression itself is never returned.
        integrationVendorName: { type: [string, 'null'] }
        matchingCount:
          type: integer
          description: >
            Present when the segment was just created, or just updated with new
            `requirements`; omitted otherwise. A live count at that moment, not
            kept in sync afterward (call `segments.count` for the current value).

    SegmentCreate:
      type: object
      required: [name, contactSchema, requirements]
      properties:
        name: { type: string }
        description: { type: [string, 'null'] }
        contactSchema: { type: string, description: A contact schema id or slug. }
        requirements: { type: string, description: Natural-language description of the filter criteria. }

    SegmentUpdate:
      type: object
      description: At least one field must be provided. Supplying `requirements` regenerates the condition (billed, `ai` rate bucket).
      properties:
        name: { type: string }
        description: { type: [string, 'null'] }
        requirements: { type: string }

    ImportFailureSample:
      type: object
      required: [rowNumber, identifier, reason]
      properties:
        rowNumber: { type: integer }
        identifier: { type: [string, 'null'] }
        reason: { type: string }

    Import:
      type: object
      required:
        [id, createdAt, schemaId, schemaSlug, fileName, byteSize, status, failureReason, rowCount, successCount, failureCount, skippedFieldCount, failureSamples, failureLogUrl, startedAt, finishedAt]
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        schemaId: { type: string }
        schemaSlug: { type: string }
        fileName: { type: string }
        byteSize: { type: integer }
        status:
          type: string
          enum: [pending, running, succeeded, partial, failed, canceled]
        failureReason: { type: [string, 'null'] }
        rowCount: { type: integer }
        successCount: { type: integer }
        failureCount: { type: integer }
        skippedFieldCount: { type: integer }
        failureSamples:
          type: array
          items: { $ref: '#/components/schemas/ImportFailureSample' }
        failureLogUrl:
          type: [string, 'null']
          description: When set, always points at `imports.downloadFailureLog`, never a raw storage URL.
        startedAt: { type: [string, 'null'], format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }

    ImportCreate:
      type: object
      required: [fileUrl, byteSize]
      properties:
        fileUrl:
          type: string
          format: uri
          description: URL of an already-uploaded CSV file. Not inline records or raw CSV text.
        byteSize: { type: integer, description: "File size in bytes. Rejected above 50 MB." }
        fileName: { type: [string, 'null'] }
        defaultTags:
          type: array
          items: { type: string }
        defaultSubscriptions:
          type: array
          items: { $ref: '#/components/schemas/CommunicationChannel' }

    TemplateFrom:
      description: "A sender: either a verified domain with a manual slug and display name, or a saved sender profile."
      oneOf:
        - type: object
          required: [type, domainId, code]
          properties:
            type: { type: string, const: domain }
            domainId: { type: string }
            code: { type: string, description: Email local part. }
            name: { type: [string, 'null'] }
        - type: object
          required: [type, senderId]
          properties:
            type: { type: string, const: sender }
            senderId: { type: string }

    DataPath:
      type: array
      description: A path into a data payload, as property-key segments.
      items: { type: string }

    AttributeExpansions:
      type: object
      description: >
        Which evaluated attributes to compute before a record-typed data property
        is consumed, as a map keyed by evaluated attribute key, nested
        recursively for evaluated attributes that themselves return records. An
        empty object computes no evaluated attributes.
      additionalProperties:
        $ref: '#/components/schemas/AttributeExpansions'

    DataRepresentationProperty:
      description: >
        One property of a data representation. `record` properties reference
        records from a schema; `json` properties are plain JSON values described
        by a JSON schema. `schema` accepts an id or slug on input; responses
        always echo the slug.
      oneOf:
        - type: object
          required: [key, type, schema]
          properties:
            key: { type: string }
            type: { type: string, const: record }
            schema: { type: string, description: A schema id or slug. }
            isArray: { type: boolean, default: false }
            description: { type: [string, 'null'] }
        - type: object
          required: [key, type, jsonSchema]
          properties:
            key: { type: string }
            type: { type: string, const: json }
            jsonSchema:
              type: object
              description: A simplified JSON Schema describing the value.
            description: { type: [string, 'null'] }

    Template:
      type: object
      required:
        [id, createdAt, updatedAt, name, description, transactional, contentFormat, contentEditor, content, from, recipientDataPath, expectedDataRepresentation, communicationTopicId]
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        name: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        transactional: { type: boolean }
        contentFormat:
          type: [string, 'null']
          enum: [mjml, html, null]
        contentEditor:
          type: [string, 'null']
          enum: [rich, raw, null]
        content:
          oneOf:
            - type: object
              required: [subject, body]
              properties:
                subject: { type: [string, 'null'] }
                body: { type: [string, 'null'] }
            - type: 'null'
        from:
          oneOf:
            - { $ref: '#/components/schemas/TemplateFrom' }
            - { type: 'null' }
        recipientDataPath: { $ref: '#/components/schemas/DataPath' }
        expectedDataRepresentation:
          type: array
          items: { $ref: '#/components/schemas/DataRepresentationProperty' }
        communicationTopicId: { type: [string, 'null'] }

    TemplateCreate:
      type: object
      required: [transactional, content, recipientDataPath, expectedDataRepresentation]
      properties:
        name: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        transactional: { type: boolean }
        content:
          type: object
          required: [bodyFormat, subject, body]
          description: Raw editor content only; created templates always start in the raw editor.
          properties:
            bodyFormat: { type: string, enum: [mjml, html] }
            subject: { type: string }
            body: { type: string }
        from: { $ref: '#/components/schemas/TemplateFrom' }
        recipientDataPath: { $ref: '#/components/schemas/DataPath' }
        communicationTopicId: { type: [string, 'null'] }
        attributeExpansions: { $ref: '#/components/schemas/AttributeExpansions' }
        expectedDataRepresentation:
          type: array
          items: { $ref: '#/components/schemas/DataRepresentationProperty' }

    TemplateUpdate:
      type: object
      description: At least one field must be provided.
      properties:
        name: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        transactional: { type: boolean }
        content:
          type: object
          required: [bodyFormat, subject, body]
          properties:
            bodyFormat: { type: string, enum: [mjml, html] }
            subject: { type: string }
            body: { type: string }
        from: { $ref: '#/components/schemas/TemplateFrom' }
        recipientDataPath: { $ref: '#/components/schemas/DataPath' }
        communicationTopicId: { type: [string, 'null'] }
        attributeExpansions: { $ref: '#/components/schemas/AttributeExpansions' }
        expectedDataRepresentation:
          type: array
          items: { $ref: '#/components/schemas/DataRepresentationProperty' }

    TemplateSendRequest:
      type: object
      required: [data]
      properties:
        data:
          type: object
          description: >
            Payload keyed by the template's expected data-representation
            properties. Minimal identifiers suffice for record properties (e.g.
            `{ "email": "user@example.com" }` for a contact); the platform
            finds-or-creates the record, then reads it back for rendering.
          additionalProperties: true

    TemplateSendResponse:
      type: object
      required: [emailId, status, error]
      properties:
        emailId: { type: [string, 'null'] }
        status:
          type: [string, 'null']
          enum: [sent, failed, null]
        error:
          type: [string, 'null']
          description: A generic message when `status` is `failed`. The real failure detail stays server-side.

    BroadcastSchedulingStatus:
      type: string
      enum: [none, draft, send now, send at]

    BroadcastAudience:
      description: The broadcast's resolved audience.
      oneOf:
        - type: object
          required: [type]
          properties:
            type: { type: string, const: all }
        - type: object
          required: [type, segmentId]
          properties:
            type: { type: string, const: segment }
            segmentId: { type: string }
        - type: object
          required: [type, requirements, conditionDescriptionMarkdown]
          properties:
            type: { type: string, const: custom filter }
            requirements: { type: string }
            conditionDescriptionMarkdown: { type: string }

    BroadcastAudienceInput:
      description: >
        The audience to create or update a broadcast with. A `custom filter`
        audience can only be set via `broadcasts.generateAudience`, never
        directly through create/update.
      oneOf:
        - type: object
          required: [type]
          properties:
            type: { type: string, const: all }
        - type: object
          required: [type, segmentId]
          properties:
            type: { type: string, const: segment }
            segmentId: { type: string }

    BroadcastContentInput:
      type: object
      required: [bodyFormat, subject, body]
      description: Raw editor content only, no rich-editor structure.
      properties:
        bodyFormat: { type: string, enum: [mjml, html] }
        subject: { type: string }
        body: { type: string }
        transactional: { type: boolean, default: false }
        from: { $ref: '#/components/schemas/TemplateFrom' }
        communicationTopicId: { type: [string, 'null'] }

    Broadcast:
      type: object
      required:
        [id, createdAt, updatedAt, name, description, contactSchemaId, contactSchemaSlug, schedulingStatus, scheduledFor, sendingStartedAt, sendingFinishedAt, failureReason, audience, hasContent]
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        name: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        contactSchemaId: { type: string }
        contactSchemaSlug: { type: string }
        schedulingStatus: { $ref: '#/components/schemas/BroadcastSchedulingStatus' }
        scheduledFor: { type: [string, 'null'], format: date-time }
        sendingStartedAt: { type: [string, 'null'], format: date-time }
        sendingFinishedAt: { type: [string, 'null'], format: date-time }
        failureReason: { type: [string, 'null'] }
        audience: { $ref: '#/components/schemas/BroadcastAudience' }
        hasContent:
          type: boolean
          description: "Never includes the underlying email content itself (e.g. raw Adaptyle markup), only this boolean summary."

    BroadcastCreate:
      type: object
      required: [contactSchema]
      properties:
        name: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        contactSchema: { type: string, description: A contact schema id or slug. }
        scheduledFor: { type: [string, 'null'], format: date-time }
        audience: { $ref: '#/components/schemas/BroadcastAudienceInput' }
        content: { $ref: '#/components/schemas/BroadcastContentInput' }

    BroadcastUpdate:
      type: object
      description: >
        At least one field must be provided. Only `name`/`description`/
        `audience`/`scheduledFor` are updatable; content is not editable through
        this endpoint. Rejected once sending has started.
      properties:
        name: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        audience: { $ref: '#/components/schemas/BroadcastAudienceInput' }
        scheduledFor: { type: [string, 'null'], format: date-time }

    BroadcastSendRequest:
      type: object
      description: An empty or omitted body sends now; a `scheduledFor` schedules for later.
      properties:
        scheduledFor: { type: string, format: date-time }

    BroadcastAudienceGenerateRequest:
      type: object
      required: [requirements]
      properties:
        requirements:
          type: string
          description: Natural-language description of the audience filter criteria.

    BroadcastAudienceGenerateResponse:
      type: object
      required: [audience, matchingCount]
      properties:
        audience:
          type: object
          required: [type, requirements, conditionDescriptionMarkdown]
          properties:
            type: { type: string, const: custom filter }
            requirements: { type: string }
            conditionDescriptionMarkdown: { type: string }
        matchingCount:
          type: integer
          description: A live count at generation time, not kept in sync afterward.

    BroadcastRun:
      type: object
      required: [id, createdAt, contactId, contactEmail, status, failureReason, email]
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        contactId: { type: string }
        contactEmail: { type: [string, 'null'] }
        status:
          type: string
          enum: [sent, failed, pending]
        failureReason: { type: [string, 'null'] }
        email:
          oneOf:
            - type: object
              required: [id, sentAt, opensCount, clicksCount, bounced, complained]
              properties:
                id: { type: string }
                sentAt: { type: [string, 'null'], format: date-time }
                opensCount: { type: integer }
                clicksCount: { type: integer }
                bounced: { type: boolean }
                complained: { type: boolean }
            - type: 'null'

    EmailAggregatedMetrics:
      type: object
      required: [sent, delivered, bounced, deliveryDelays, rejected, failed, complained, unsubscribed, opens, uniqueOpens, clicks, uniqueClicks]
      properties:
        sent: { type: integer }
        delivered: { type: integer }
        bounced: { type: integer }
        deliveryDelays: { type: integer }
        rejected: { type: integer }
        failed: { type: integer }
        complained: { type: integer }
        unsubscribed: { type: integer }
        opens: { type: integer }
        uniqueOpens: { type: integer }
        clicks: { type: integer }
        uniqueClicks: { type: integer }

    BroadcastMetricsResponse:
      type: object
      description: "`email` is omitted entirely when the broadcast has no email content yet."
      properties:
        email: { $ref: '#/components/schemas/EmailAggregatedMetrics' }

    WebhookTrigger:
      type: string
      enum:
        - contact upserted
        - contact deleted
        - object upserted
        - object deleted
        - event fired
        - email event

    EmailEventType:
      type: string
      enum:
        - scheduled
        - sending failed
        - sent
        - rejected
        - unsubscribed
        - bounced
        - complained
        - delivered
        - opened
        - clicked
        - delivery delayed

    WebhookStatus:
      type: string
      enum: [live, paused, circuit breaker]

    WebhookCondition:
      description: The webhook's resolved filter condition. The generated expression is never returned, only its description.
      oneOf:
        - type: object
          required: [type]
          properties:
            type: { type: string, const: none }
        - type: object
          required: [type, segmentId]
          properties:
            type: { type: string, const: segment }
            segmentId: { type: string }
        - type: object
          required: [type, description]
          properties:
            type: { type: string, const: custom filter }
            description: { type: string }

    WebhookConditionInput:
      description: >
        The filter condition to create or update a webhook with. A `custom
        filter` condition generates via AI from `requirements` (billed, `ai`
        rate bucket).
      oneOf:
        - type: object
          required: [type]
          properties:
            type: { type: string, const: none }
        - type: object
          required: [type, segmentId]
          properties:
            type: { type: string, const: segment }
            segmentId: { type: string }
        - type: object
          required: [type, requirements]
          properties:
            type: { type: string, const: custom filter }
            requirements:
              type: string
              description: Natural-language description of the filter criteria.

    Webhook:
      type: object
      required:
        - id
        - createdAt
        - updatedAt
        - url
        - trigger
        - emailEventTypes
        - schemaId
        - condition
        - status
        - totalCalls
        - failedCalls
        - failedCallsInARow
        - lastCalledAt
        - lastCallErrorMessage
        - integrationVendorName
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        url: { type: string, format: uri }
        trigger: { $ref: '#/components/schemas/WebhookTrigger' }
        emailEventTypes:
          type: array
          items: { $ref: '#/components/schemas/EmailEventType' }
        schemaId: { type: [string, 'null'] }
        condition: { $ref: '#/components/schemas/WebhookCondition' }
        status: { $ref: '#/components/schemas/WebhookStatus' }
        totalCalls: { type: integer }
        failedCalls: { type: integer }
        failedCallsInARow: { type: integer }
        lastCalledAt: { type: [string, 'null'], format: date-time }
        lastCallErrorMessage: { type: [string, 'null'] }
        integrationVendorName:
          type: [string, 'null']
          description: Non-null means the webhook is integration-owned and cannot be updated, deleted, or rotated.

    WebhookWithSecret:
      allOf:
        - { $ref: '#/components/schemas/Webhook' }
        - type: object
          required: [signatureVerificationSecret]
          properties:
            signatureVerificationSecret: { type: string }

    WebhookCreate:
      type: object
      required: [url, trigger]
      properties:
        url: { type: string, format: uri }
        trigger: { $ref: '#/components/schemas/WebhookTrigger' }
        emailEventTypes:
          type: array
          description: Required and non-empty only when trigger is `email event`.
          items: { $ref: '#/components/schemas/EmailEventType' }
        schemaId:
          type: [string, 'null']
          description: A schema id or slug. Required for every trigger except `email event`.
        condition:
          $ref: '#/components/schemas/WebhookConditionInput'

    WebhookUpdate:
      type: object
      description: At least one field must be provided. Trigger and schema are not updatable.
      properties:
        url: { type: string, format: uri }
        emailEventTypes:
          type: array
          items: { $ref: '#/components/schemas/EmailEventType' }
        condition: { $ref: '#/components/schemas/WebhookConditionInput' }
        status:
          type: string
          enum: [live, paused]

    RotatedWebhookSecret:
      type: object
      required: [id, signatureVerificationSecret, updatedAt]
      properties:
        id: { type: string }
        signatureVerificationSecret: { type: string }
        updatedAt: { type: string, format: date-time }

    Workflow:
      type: object
      required: [id, createdAt, updatedAt, name, description, paused, isDirty, published]
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        name: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        paused: { type: boolean }
        isDirty: { type: boolean, description: Has unpublished changes. }
        published: { type: boolean }

    WorkflowRunStepHistoryRecord:
      type: object
      required: [stepId, stepLabel, slotKey, enteredAt, leftAt, failureReason]
      properties:
        stepId: { type: string }
        stepLabel: { type: [string, 'null'] }
        slotKey: { type: [string, 'null'] }
        enteredAt: { type: string, format: date-time }
        leftAt: { type: string, format: date-time }
        failureReason: { type: [string, 'null'] }

    WorkflowRun:
      type: object
      required: [id, createdAt, updatedAt, versionId, status, failureReason, stepHistory]
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        versionId: { type: string }
        status:
          type: string
          enum: [running, completed, failed]
        failureReason: { type: [string, 'null'] }
        stepHistory:
          type: array
          items: { $ref: '#/components/schemas/WorkflowRunStepHistoryRecord' }

    ApiKey:
      type: object
      required: [id, createdAt, name, keyDisplay, spaceId, createdViaApiKeyId]
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        name: { type: [string, 'null'] }
        keyDisplay: { type: string, description: "A masked preview, e.g. `max_...ab12`." }
        spaceId: { type: [string, 'null'] }
        createdViaApiKeyId: { type: [string, 'null'] }

    ApiKeyCreate:
      type: object
      properties:
        name: { type: [string, 'null'] }

    ApiKeyWithSecret:
      allOf:
        - { $ref: '#/components/schemas/ApiKey' }
        - type: object
          required: [key]
          properties:
            key:
              type: string
              description: The plaintext API key. Shown exactly once; save it immediately.

    FormContactInput:
      type: object
      description: Flat contact input for the form's contact schema. Custom attribute keys are passed at the top level.
      properties:
        id: { type: [string, 'null'] }
        fullName: { type: [string, 'null'] }
        firstName: { type: [string, 'null'] }
        lastName: { type: [string, 'null'] }
        avatarUrl: { type: [string, 'null'] }
        userId: { type: [string, 'null'] }
        email: { type: [string, 'null'], format: email }
        phone: { type: [string, 'null'] }
        notes: { type: [string, 'null'] }
        tags:
          type: [array, 'null']
          items: { type: string }
      additionalProperties: true

    FormSubmission:
      type: object
      required: [contact]
      properties:
        contact: { $ref: '#/components/schemas/FormContactInput' }
        emailMarketingConsent: { type: [boolean, 'null'] }
        captchaToken: { type: [string, 'null'] }

    FormSubmissionResult:
      oneOf:
        - type: object
          required: [contactId]
          properties:
            contactId: { type: string }
        - type: object
          required: [status]
          properties:
            status: { type: string, const: verification_pending }
