      summary: Get a template
      description: "Error: `template_not_found`."
      operationId: templates.get
      responses:
        '200':
          description: The template.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Template' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }
  /templates/{templateId}/send:
    parameters:
      - name: templateId
        in: path
        required: true
        description: The template id.
        schema: { type: string }
    post:
      tags: [Templates]
      summary: Send a template
      description: >
        Renders and sends a template to the recipient resolved from `data`
        (validated against the template's `expectedDataRepresentation`; records
        referenced by `data` are upserted as a side effect before rendering). The
        send is synchronous. Warnings are returned in the body's `warnings` array.
        Supports `Idempotency-Key`. Pre-send validation/eligibility failures throw
        as request errors, not as a `200` with `status: failed`:
        `email_limit_reached` (402), `sending_disabled` (422),
        `template_not_sendable` (400), `domain_not_verified` (422), `invalid_data`
        (400), `marketing_requires_contact` (422), `recipient_not_subscribed`
        (422), `recipient_suppressed` (422). A genuine SES send failure instead
        returns `200` with `status: "failed"` and a generic `error` message (the
        real failure detail stays server-side).
      operationId: templates.send
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKeyParam' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TemplateSendRequest' }
      responses:
        '200':
          description: The send was processed.
          headers:
            Idempotent-Replay: { $ref: '#/components/headers/IdempotentReplay' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/TemplateSendResponse' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /webhooks:
    get:
      tags: [Webhooks]
