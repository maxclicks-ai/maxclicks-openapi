openapi: 3.1.0

info:
  title: maxclicks Public API
  version: 1.1.0
  summary: The official REST API for the maxclicks email, CRM, and automation platform.
  description: >
    The maxclicks Public API v1. Read and write contacts and objects, fire events, build and
    query segments, send templates, trigger and measure broadcasts, manage webhooks, trigger and
    inspect workflows, manage the suppression list, and submit forms.


    The surface follows one principle: entities are authored in the maxclicks app, and the API
    triggers, reads and measures them. Schemas, attributes, templates, broadcasts, domains,
    senders, topics and API keys are therefore created and configured in the app; this API reads
    them so a caller can discover ids, shapes and status, and drives the sends and automations
    that depend on them.


    All authenticated endpoints use a bearer API key. Successful responses are wrapped in a
    `data` envelope (with an optional `warnings` array); list endpoints add a `pagination`
    block (offset-based, except `events.list`, which is cursor-based). Errors use a
    Stripe-style `{ error: { type, code, message, issues? } }` envelope: `type` is
    `invalid_request_error` for every 4xx and `api_error` for every 5xx; `code` is a stable
    machine-readable string or `null`; `issues` is present only on the handful of validation-gate
    failures that report more than one problem at once (for example `broadcasts.send`'s
    `broadcast_invalid`).


    Rate limits are enforced per API key, in three buckets: `read` (100 requests/second, every
    `GET`), `write` (25 requests/second, every other `POST`/`PATCH`/`DELETE`), and `ai` (10
    requests/minute, for the LLM-backed endpoints: `segments.create`, and
    `webhooks.create`/`webhooks.update` when they carry a `custom filter` condition).
    Exceeding a limit returns `429` with a `Retry-After` header
    (an HTTP date, UTC).


    Beyond the usual 200/201/400/401/403/404/409/422/429/500, four status codes appear on this
    surface: `402` payment required (`insufficient_credits` on an AI-generation call or a
    schema with AI auto-fill; `email_limit_reached` on `templates.send`); `405` method not
    allowed (`events_immutable`, events cannot be edited or deleted, fire a new one); `413`
    payload too large (`payload_too_large`, request body over 10 MB); `415` unsupported media
    type (`unsupported_media_type`). `400` also covers `malformed_json` (body is not valid JSON)
    and, on paginated list endpoints, `offset_too_large` (an `offset` past the pagination cap).


    Seven mutating operations (records.create, records.upsert, suppressions.batchCreate,
    suppressions.batchDelete, broadcasts.send, templates.send, workflows.trigger) accept an
    `Idempotency-Key` header to make retries safe: the first request with a given key claims and
    executes normally; a retry while the original is still in flight returns `409
    idempotency_conflict` (unless the pending claim is older than 60 seconds, in which case it is
    treated as abandoned); a retry after the original completed replays the original status and
    body verbatim with an `Idempotent-Replay: true` response header. A `5xx` response is never
    cached, and neither is a `4xx`: a rejected request did nothing, so the caller is free to fix the
    payload and retry with the same key. Records expire after 24 hours. The key is scoped to the API
    key, the resolved request path and a hash of the request body, so the same key against two
    different resources does not collide, and reusing a key with a CHANGED body returns `422
    idempotency_key_reused` rather than silently replaying the previous response. Secret-returning
    creates (`webhooks.create`,
    `webhooks.rotateSecret`) deliberately do not support it, since replaying the cached response
    would re-expose the plaintext secret.
  contact:
    name: maxclicks
    url: https://maxclicks.ai
    email: info@maxclicks.ai
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

externalDocs:
  description: Developer documentation
  url: https://docs.maxclicks.ai

servers:
  - url: https://api.maxclicks.ai/v1
    description: Production
  - url: https://api-stage.maxclicks.ai/v1
    description: Staging

security:
  - bearerAuth: []

tags:
  - name: Meta
    description: Identify the calling API key.
  - name: Schemas
    description: Manage the space's schemas (contact, object, event).
  - name: Attributes
    description: Read a schema's attributes. Attributes are authored in the app.
  - name: Records
    description: Create, read, update, and delete contact and object records.
  - name: Suppressions
    description: Manage the email do-not-contact list. Requires an admin key.
  - name: Events
    description: Fire trigger events and read them back.
  - name: Domains
    description: Read sending domains and their DNS verification status. Domains are added and verified in the app.
  - name: Senders
    description: Manage saved sender profiles.
  - name: Topics
    description: Manage communication topics.
  - name: Segments
    description: Generate and manage AI-defined contact filters.
  - name: Broadcasts
    description: Schedule, send, and measure mass emails. Broadcasts are authored in the app.
  - name: Templates
    description: Send stored message templates. Templates are authored in the app.
  - name: Webhooks
    description: Manage outgoing webhooks.
  - name: Workflows
    description: Trigger workflows and inspect their runs.
  - name: Forms
    description: Public form submission and double opt-in confirmation.
  - name: Emails
    description: Public email recipient actions.

paths:
  /me:
    get:
      tags: [Meta]
      summary: Identify the calling API key
      description: >
        Returns the key metadata, its owning user, the bound space (if any), and
        the caller's role. Works for space-unbound keys, in which case `space`
        and `role` are null.
      operationId: meta.me
      responses:
        '200':
          description: The identity of the calling key.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Me' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /schemas:
    get:
      tags: [Schemas]
      summary: List schemas
      description: Lists the space's schemas, optionally filtered by type.
      operationId: schemas.list
      parameters:
        - name: type
          in: query
          description: Filter by one or more schema types. Repeat the parameter to pass several.
          required: false
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: '#/components/schemas/SchemaType' }
        - { $ref: '#/components/parameters/LimitParam' }
        - { $ref: '#/components/parameters/OffsetParam' }
      responses:
        '200':
          description: A page of schemas.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Schema' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }
  /schemas/{schema}:
    parameters:
      - { $ref: '#/components/parameters/SchemaParam' }
    get:
      tags: [Schemas]
      summary: Get a schema
      description: Fetches a single schema by id or slug.
      operationId: schemas.get
      responses:
        '200':
          description: The schema.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Schema' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }
  /schemas/{schema}/attributes:
    parameters:
      - { $ref: '#/components/parameters/SchemaParam' }
    get:
      tags: [Attributes]
      summary: List attributes
      description: Lists a schema's attributes, base attributes first, then custom attributes.
      operationId: attributes.list
      parameters:
        - { $ref: '#/components/parameters/LimitParam' }
        - { $ref: '#/components/parameters/OffsetParam' }
      responses:
        '200':
          description: A page of attributes.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Attribute' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /schemas/{schema}/records:
    parameters:
      - { $ref: '#/components/parameters/SchemaParam' }
    get:
      tags: [Records]
      summary: List records
      description: Lists records in a contact or object schema, oldest first.
      operationId: records.list
      parameters:
        - { $ref: '#/components/parameters/LimitParam' }
        - { $ref: '#/components/parameters/OffsetParam' }
      responses:
        '200':
          description: A page of records.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Record' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Records]
      summary: Create a record
      description: >
        Strictly creates one contact or object record (never updates an existing
        one). Any `id` in the body is ignored. `source` is forced to `api`. If the
        schema has an AI auto-fill attribute, credits are checked first. Supports
        `Idempotency-Key`. Errors: `schema_not_found`, `identifier_conflict` (409),
        `insufficient_credits` (402).
      operationId: records.create
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKeyParam' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordInput' }
      responses:
        '201':
          description: The created record.
          headers:
            Idempotent-Replay: { $ref: '#/components/headers/IdempotentReplay' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /schemas/{schema}/records/upsert:
    parameters:
      - { $ref: '#/components/parameters/SchemaParam' }
    post:
      tags: [Records]
      summary: Upsert a record
      description: >
        Creates or updates a record by identity. Contact match cascade is
        id, then userId, then email, then phone; object match is id, then
        externalId. Per-field identifier conflicts are reverted and reported in
        `warnings`. Returns 201 when created, 200 when updated. Same AI auto-fill
        credit check as create. Supports `Idempotency-Key`. Errors:
        `schema_not_found`, `record_not_found` (404, an explicit `id` matched no
        record), `insufficient_credits` (402).
      operationId: records.upsert
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKeyParam' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordInput' }
      responses:
        '200':
          description: The updated record.
          headers:
            Idempotent-Replay: { $ref: '#/components/headers/IdempotentReplay' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordEnvelope' }
        '201':
          description: The created record.
          headers:
            Idempotent-Replay: { $ref: '#/components/headers/IdempotentReplay' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /schemas/{schema}/records/{id}:
    parameters:
      - { $ref: '#/components/parameters/SchemaParam' }
      - { $ref: '#/components/parameters/RecordIdParam' }
    get:
      tags: [Records]
      summary: Get a record
      operationId: records.get
      responses:
        '200':
          description: The record.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }
    patch:
      tags: [Records]
      summary: Update a record
      description: >
        Partially updates a record. An explicit null clears a nullable field.
        Does not run the AI auto-fill credit check that create/upsert do.
        Errors: `schema_not_found`, `record_not_found`, `identifier_conflict` (409).
      operationId: records.update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordInput' }
      responses:
        '200':
          description: The updated record.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [Records]
      summary: Delete a record
      operationId: records.delete
      responses:
        '200':
          description: The record was deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletedEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /schemas/{schema}/records/{id}/audit-trail:
    parameters:
      - { $ref: '#/components/parameters/SchemaParam' }
      - { $ref: '#/components/parameters/RecordIdParam' }
    get:
      tags: [Records]
      summary: List a contact's audit trail
      description: >
        Lists the consent and communication audit trail for a contact, newest
        first. Contact schemas only. Errors: `schema_not_found`, `record_not_found`.
      operationId: records.auditTrail
      parameters:
        - name: channel
          in: query
          required: false
          description: Filter by communication channel.
          schema: { $ref: '#/components/schemas/CommunicationChannel' }
        - { $ref: '#/components/parameters/LimitParam' }
        - { $ref: '#/components/parameters/OffsetParam' }
      responses:
        '200':
          description: A page of audit-trail entries.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AuditTrailEntry' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /contacts/suppressions:
    get:
      tags: [Suppressions]
      summary: List suppressions
      description: >
        Lists suppressions for the caller's space, newest first. Includes global
        suppressions (not space-scoped) alongside space-scoped ones, since both
        block sends to the caller's contacts. Requires an admin key.
      operationId: suppressions.list
      parameters:
        - name: identifier
          in: query
          required: false
          description: Filter to the suppression(s) for one email address.
          schema: { type: string, format: email }
        - { $ref: '#/components/parameters/LimitParam' }
        - { $ref: '#/components/parameters/OffsetParam' }
      responses:
        '200':
          description: A page of suppressions.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Suppression' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Suppressions]
      summary: Create a suppression
      description: >
        Suppresses an email identifier for the space. Requires an admin key. Not
        Idempotency-Key aware. Error: `suppression_already_exists` (409; `manual`
        and `legal` are distinct reasons).
      operationId: suppressions.create
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SuppressionInput' }
      responses:
        '201':
          description: The created suppression.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Suppression' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /contacts/suppressions/batch:
    post:
      tags: [Suppressions]
      summary: Batch-create suppressions
      description: >
        Bulk-creates 1 to 100 suppressions in one call. Each item is validated and
        processed independently: an existing suppression for the same identifier
        and reason returns `exists` rather than failing the item. Requires an
        admin key. Supports `Idempotency-Key`. Always responds `200`.
      operationId: suppressions.batchCreate
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKeyParam' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SuppressionBatchCreateRequest' }
      responses:
        '200':
          description: Per-item results and a summary.
          headers:
            Idempotent-Replay: { $ref: '#/components/headers/IdempotentReplay' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/SuppressionBatchCreateResult' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /contacts/suppressions/batch-remove:
    post:
      tags: [Suppressions]
      summary: Batch-delete suppressions
      description: >
        Bulk-removes 1 to 100 suppressions by id in one call. Each id is gated
        exactly like the single delete (must belong to the caller's space; reason
        must be `manual` or `legal`). Requires an admin key. Supports
        `Idempotency-Key`. Always responds `200`.
      operationId: suppressions.batchDelete
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKeyParam' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SuppressionBatchDeleteRequest' }
      responses:
        '200':
          description: Per-item results and a summary.
          headers:
            Idempotent-Replay: { $ref: '#/components/headers/IdempotentReplay' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/SuppressionBatchDeleteResult' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /contacts/suppressions/{id}:
    parameters:
      - { $ref: '#/components/parameters/SuppressionIdParam' }
    delete:
      tags: [Suppressions]
      summary: Delete a suppression
      description: >
        Removes a suppression, re-allowing communication to that identifier.
        Requires an admin key. Not Idempotency-Key aware. Errors:
        `suppression_not_found`, `suppression_reason_not_removable` (403, a
        system-applied reason such as a hard bounce, not `manual`/`legal`).
      operationId: suppressions.delete
      responses:
        '200':
          description: The suppression was removed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletedEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /events:
    get:
      tags: [Events]
      summary: List events
      description: >
        Cursor-paginated event history for one event schema, newest first, read
        through the ClickHouse-backed archive (so it sees every event ever fired,
        not just ones that triggered backend processing). `from`/`to` default to
        the 7 days before now when omitted; a wider span than
        `config.publicApi.maximumEventListRangeDays` (90 days) is silently clamped
        with a warning, not rejected. This endpoint uses the distinct cursor
        pagination envelope, not the offset envelope used elsewhere in v1: there
        is no `offset` parameter and no `totalCount`. Errors: `schema_not_found`,
        `invalid_cursor`, `invalid_time_range`, `event_archive_unavailable` (502).
      operationId: events.list
      parameters:
        - name: schema
          in: query
          required: true
          description: The event schema id or slug.
          schema: { type: string }
        - name: from
          in: query
          required: false
          description: Start of the time range (ISO 8601). Defaults to 7 days before `to`.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          description: End of the time range (ISO 8601). Defaults to now.
          schema: { type: string, format: date-time }
        - name: cursor
          in: query
          required: false
          description: Opaque cursor from a previous page's `pagination.nextCursor`.
          schema: { type: string }
        - name: limit
          in: query
          required: false
          description: Page size. Defaults to 50, capped at 200.
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
      responses:
        '200':
          description: A cursor page of events.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Event' }
                  pagination: { $ref: '#/components/schemas/CursorPagination' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }
        '502': { $ref: '#/components/responses/IngestUnavailable' }

  /events/{schema}:
    x-note: >
      OpenAPI templates `/events/{schema}` (fire) and `/events/{id}` (get one) as the same path
      shape, so this path item merges both under one templated path with `post` and `get`,
      mirroring how the server dispatches them by method. The wire URLs are unchanged.
      `PATCH`/`DELETE /events/{id}` always return `405 events_immutable` ("Events are immutable.
      Fire a new event instead."), a deliberate guard, not a real operation, and not modeled here.
    post:
      tags: [Events]
      summary: Fire an event
      description: >
        Fires a single event of the given event schema. Asynchronous fire and
        forget: the event is handed to the ingest pipeline and 202 is returned
        with the accepted count. The body is the flat event input. Not
        Idempotency-Key aware; dedupe with your own `eventId` instead. Errors:
        `schema_not_found`, `ingest_unavailable` (502).
      operationId: events.fire
      parameters:
        - name: schema
          in: path
          required: true
          description: The event schema id or slug.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventInput' }
      responses:
        '202':
          description: The event was accepted by the ingest pipeline.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/FireResult' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/IngestUnavailable' }
  /events/{schema}/batch:
    parameters:
      - { $ref: '#/components/parameters/SchemaParam' }
    post:
      tags: [Events]
      summary: Fire a batch of events
      description: >
        Fires up to 500 events of one schema. With `onError: continue` (the
        default) every item is validated, the whole valid subset is handed to the
        ingest pipeline in one call, and 200 is returned with per-item results;
        if that single ingest call itself fails, the whole request fails `502
        ingest_unavailable` rather than a partial success. With `onError: abort`
        the batch stops at the first invalid item, ingests nothing, and returns
        422 with `failedIndex`. Not Idempotency-Key aware.
      operationId: events.fireBatch
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventBatchRequest' }
      responses:
        '200':
          description: Per-item results and a summary.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/BatchFireResult' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422':
          description: The batch aborted on the first invalid item.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/BatchFireResult' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/IngestUnavailable' }

