openapi: 3.1.0

info:
  title: maxclicks Public API
  version: 1.1.0
  summary: The official REST API for the maxclicks email, CRM, and automation platform.
  description: >
    The maxclicks Public API v1. Manage contacts and objects, fire events, run imports, generate
    segments and audiences, send templates and broadcasts, manage domains/senders/topics,
    manage webhooks, trigger and inspect workflows, manage API keys, and submit forms.


    All authenticated endpoints use a bearer API key. Successful responses are wrapped in a
    `data` envelope (with an optional `warnings` array); list endpoints add a `pagination`
    block (offset-based, except `events.list`, which is cursor-based). Errors use a
    Stripe-style `{ error: { type, code, message, issues? } }` envelope: `type` is
    `invalid_request_error` for every 4xx and `api_error` for every 5xx; `code` is a stable
    machine-readable string or `null`; `issues` is present only on the handful of validation-gate
    failures that report more than one problem at once (for example `broadcasts.send`'s
    `broadcast_invalid`).


    Rate limits are enforced per API key, in three buckets: `read` (100 requests/second, every
    `GET`), `write` (25 requests/second, every other `POST`/`PATCH`/`DELETE`), and `ai` (10
    requests/minute, for the handful of LLM-backed endpoints: `attributes.create` with
    `requirements`, `segments.create`, `segments.update` with `requirements`,
    `webhooks.create`/`webhooks.update` with a `custom filter` condition, and
    `broadcasts.generateAudience`). Exceeding a limit returns `429` with a `Retry-After` header
    (an HTTP date, UTC).


    Beyond the usual 200/201/400/401/403/404/409/422/429/500, four status codes appear on this
    surface: `402` payment required (`insufficient_credits` on an AI-generation call or a
    schema with AI auto-fill; `email_limit_reached` on `templates.send`); `405` method not
    allowed (`events_immutable`, events cannot be edited or deleted, fire a new one); `413`
    payload too large (`payload_too_large`, request body over 10 MB); `415` unsupported media
    type (`unsupported_media_type`). `400` also covers `malformed_json` (body is not valid JSON)
    and, on paginated list endpoints, `offset_too_large` (an `offset` past the pagination cap).


    Mutating requests on select endpoints (noted per operation below) accept an
    `Idempotency-Key` header to make retries safe: the first request with a given key claims and
    executes normally; a retry while the original is still in flight returns `409
    idempotency_conflict` (unless the pending claim is older than 60 seconds, in which case it is
    treated as abandoned); a retry after the original completed replays the original status and
    body verbatim with an `Idempotent-Replay: true` response header. A `5xx` response is never
    cached. Records expire after 24 hours. Secret-returning creates (`apiKeys.create`,
    `webhooks.create`, `webhooks.rotateSecret`) deliberately do not support it, since replaying
    the cached response would re-expose the plaintext secret.
  contact:
    name: maxclicks
    url: https://maxclicks.ai
    email: info@maxclicks.ai
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

externalDocs:
  description: Developer documentation
  url: https://docs.maxclicks.ai

servers:
  - url: https://api.maxclicks.ai/v1
    description: Production
  - url: https://api-stage.maxclicks.ai/v1
    description: Staging

security:
  - bearerAuth: []

tags:
  - name: Meta
    description: Identify the calling API key.
  - name: Schemas
    description: Manage the space's schemas (contact, object, event).
  - name: Attributes
    description: Read or add a schema's attributes.
  - name: Records
    description: Create, read, update, and delete contact and object records.
  - name: Imports
    description: Bulk-import contact and object records from a CSV file.
  - name: Suppressions
    description: Manage the email do-not-contact list. Requires an admin key.
  - name: Events
    description: Fire trigger events and read them back.
  - name: Domains
    description: Manage sending domains. Most endpoints require an admin key.
  - name: Senders
    description: Manage saved sender profiles.
  - name: Topics
    description: Manage communication topics.
  - name: Segments
    description: Generate and manage AI-defined contact filters.
  - name: Broadcasts
    description: Create, schedule, and send mass emails to a contact audience.
  - name: Templates
    description: Manage and send stored message templates.
  - name: Webhooks
    description: Manage outgoing webhooks.
  - name: Workflows
    description: Trigger workflows and inspect their runs.
  - name: API Keys
    description: Self-service API key management. Requires an admin key.
  - name: Forms
    description: Public form submission and double opt-in confirmation.
  - name: Emails
    description: Public email recipient actions.

paths:
  /me:
    get:
      tags: [Meta]
      summary: Identify the calling API key
      description: >
        Returns the key metadata, its owning user, the bound space (if any), and
        the caller's role. Works for space-unbound keys, in which case `space`
        and `role` are null.
      operationId: meta.me
      responses:
        '200':
          description: The identity of the calling key.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Me' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /schemas:
    get:
      tags: [Schemas]
      summary: List schemas
      description: Lists the space's schemas, optionally filtered by type.
      operationId: schemas.list
      parameters:
        - name: type
          in: query
          description: Filter by one or more schema types. Repeat the parameter to pass several.
          required: false
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: '#/components/schemas/SchemaType' }
        - { $ref: '#/components/parameters/LimitParam' }
        - { $ref: '#/components/parameters/OffsetParam' }
      responses:
        '200':
          description: A page of schemas.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Schema' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Schemas]
      summary: Create a schema
      description: >
        Creates a contact, object, or event schema. Supports `Idempotency-Key`.
        Errors: `invalid_schema`, `schema_name_reserved` (400, a reserved platform
        name), `schema_name_conflict` (409, name or slug already used in this space).
      operationId: schemas.create
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKeyParam' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SchemaCreate' }
      responses:
        '201':
          description: The created schema.
          headers:
            Idempotent-Replay: { $ref: '#/components/headers/IdempotentReplay' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Schema' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /schemas/{schema}:
    parameters:
      - { $ref: '#/components/parameters/SchemaParam' }
    get:
      tags: [Schemas]
      summary: Get a schema
      description: Fetches a single schema by id or slug.
      operationId: schemas.get
      responses:
        '200':
          description: The schema.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Schema' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }
    patch:
      tags: [Schemas]
      summary: Update a schema
      description: >
        Partially updates `name`/`namePlural`/`description`. `type` and `slug` are
        immutable (`400 schema_immutable_field` if a change is attempted). Errors:
        `schema_not_found`, `schema_name_conflict` (409), `schema_integration_owned`
        (403), `schema_name_reserved`, `invalid_schema`.
      operationId: schemas.update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SchemaUpdate' }
      responses:
        '200':
          description: The updated schema.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Schema' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [Schemas]
      summary: Delete a schema
      description: >
        Hard-deletes a schema and cascades its records. Errors: `schema_not_found`,
        `schema_integration_owned` (403), `schema_in_use` (409, it is the evaluation
        target of another schema's evaluated attribute, or is referenced by
        attributes, segments, broadcasts, workflow steps, or webhooks),
        `last_contact_schema` (409, it is the only contact schema in the space).
      operationId: schemas.delete
      responses:
        '200':
          description: The schema was deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletedEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /schemas/{schema}/attributes:
    parameters:
      - { $ref: '#/components/parameters/SchemaParam' }
    get:
      tags: [Attributes]
      summary: List attributes
      description: Lists a schema's attributes, base attributes first, then custom attributes.
      operationId: attributes.list
      parameters:
        - { $ref: '#/components/parameters/LimitParam' }
        - { $ref: '#/components/parameters/OffsetParam' }
      responses:
        '200':
          description: A page of attributes.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Attribute' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Attributes]
      summary: Create an attribute
      description: >
        Adds a custom attribute to the schema: either a stored attribute (via
        `definition`) or an AI-generated evaluated attribute (via a natural-language
        `requirements` prompt; credits are checked first, and this call falls in the
        `ai` rate bucket). The generated expression is never returned. Errors:
        `schema_not_found`, `invalid_attribute`, `attribute_key_conflict` (409),
        `attribute_generation_failed` (422), `insufficient_credits` (402).
      operationId: attributes.create
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttributeCreate' }
      responses:
        '201':
          description: The created attribute.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Attribute' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /schemas/{schema}/attributes/{attribute}:
    parameters:
      - { $ref: '#/components/parameters/SchemaParam' }
      - name: attribute
        in: path
        required: true
        description: Attribute selector. Accepts `base:<key>`, a custom attribute id, or a raw key.
        schema: { type: string }
    get:
      tags: [Attributes]
      summary: Get an attribute
      operationId: attributes.get
      responses:
        '200':
          description: The attribute.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Attribute' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /schemas/{schema}/records:
    parameters:
      - { $ref: '#/components/parameters/SchemaParam' }
    get:
      tags: [Records]
      summary: List records
      description: Lists records in a contact or object schema, oldest first.
      operationId: records.list
      parameters:
        - { $ref: '#/components/parameters/LimitParam' }
        - { $ref: '#/components/parameters/OffsetParam' }
      responses:
        '200':
          description: A page of records.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Record' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Records]
      summary: Create a record
      description: >
        Strictly creates one contact or object record (never updates an existing
        one). Any `id` in the body is ignored. `source` is forced to `api`. If the
        schema has an AI auto-fill attribute, credits are checked first. Supports
        `Idempotency-Key`. Errors: `schema_not_found`, `identifier_conflict` (409),
        `insufficient_credits` (402).
      operationId: records.create
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKeyParam' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordInput' }
      responses:
        '201':
          description: The created record.
          headers:
            Idempotent-Replay: { $ref: '#/components/headers/IdempotentReplay' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /schemas/{schema}/records/upsert:
    parameters:
      - { $ref: '#/components/parameters/SchemaParam' }
    post:
      tags: [Records]
      summary: Upsert a record
      description: >
        Creates or updates a record by identity. Contact match cascade is
        id, then userId, then email, then phone; object match is id, then
        externalId. Per-field identifier conflicts are reverted and reported in
        `warnings`. Returns 201 when created, 200 when updated. Same AI auto-fill
        credit check as create. Supports `Idempotency-Key`. Errors:
        `schema_not_found`, `record_not_found` (404, an explicit `id` matched no
        record), `insufficient_credits` (402).
      operationId: records.upsert
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKeyParam' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordInput' }
      responses:
        '200':
          description: The updated record.
          headers:
            Idempotent-Replay: { $ref: '#/components/headers/IdempotentReplay' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordEnvelope' }
        '201':
          description: The created record.
          headers:
            Idempotent-Replay: { $ref: '#/components/headers/IdempotentReplay' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /schemas/{schema}/records/{id}:
    parameters:
      - { $ref: '#/components/parameters/SchemaParam' }
      - { $ref: '#/components/parameters/RecordIdParam' }
    get:
      tags: [Records]
      summary: Get a record
      operationId: records.get
      responses:
        '200':
          description: The record.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }
    patch:
      tags: [Records]
      summary: Update a record
      description: >
        Partially updates a record. An explicit null clears a nullable field.
        Does not run the AI auto-fill credit check that create/upsert do.
        Errors: `schema_not_found`, `record_not_found`, `identifier_conflict` (409).
      operationId: records.update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordInput' }
      responses:
        '200':
          description: The updated record.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [Records]
      summary: Delete a record
      operationId: records.delete
      responses:
        '200':
          description: The record was deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletedEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /schemas/{schema}/records/{id}/audit-trail:
    parameters:
      - { $ref: '#/components/parameters/SchemaParam' }
      - { $ref: '#/components/parameters/RecordIdParam' }
    get:
      tags: [Records]
      summary: List a contact's audit trail
      description: >
        Lists the consent and communication audit trail for a contact, newest
        first. Contact schemas only. Errors: `schema_not_found`, `record_not_found`.
      operationId: records.auditTrail
      parameters:
        - name: channel
          in: query
          required: false
          description: Filter by communication channel.
          schema: { $ref: '#/components/schemas/CommunicationChannel' }
        - { $ref: '#/components/parameters/LimitParam' }
        - { $ref: '#/components/parameters/OffsetParam' }
      responses:
        '200':
          description: A page of audit-trail entries.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AuditTrailEntry' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /schemas/{schema}/imports:
    parameters:
      - { $ref: '#/components/parameters/SchemaParam' }
    get:
      tags: [Imports]
      summary: List imports
      operationId: imports.list
      parameters:
        - { $ref: '#/components/parameters/LimitParam' }
        - { $ref: '#/components/parameters/OffsetParam' }
      responses:
        '200':
          description: A page of imports.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Import' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Imports]
      summary: Create an import
      description: >
        Starts an asynchronous import of contact or object records from an
        already-uploaded CSV file (a reference by URL, not inline records or raw
        CSV text). Contact and object schemas only; event schemas and
        integration-owned schemas are rejected. Supports `Idempotency-Key`. Errors:
        `schema_not_found`, `schema_integration_owned` (403),
        `schema_type_not_supported` (400, an event schema), `invalid_file_url`,
        `invalid_import`, `import_file_too_large` (400, file over 50 MB).
      operationId: imports.create
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKeyParam' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportCreate' }
      responses:
        '202':
          description: The import was accepted and is processing.
          headers:
            Idempotent-Replay: { $ref: '#/components/headers/IdempotentReplay' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Import' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

