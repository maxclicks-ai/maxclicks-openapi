  /contacts/suppressions/batch:
    post:
      tags: [Suppressions]
      summary: Batch-create suppressions
      description: >
        Bulk-creates 1 to 100 suppressions in one call. Each item is validated and
        processed independently: an existing suppression for the same identifier
