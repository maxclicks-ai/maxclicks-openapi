      tags: [Suppressions]
      summary: Batch-delete suppressions
      description: >
        Bulk-removes 1 to 100 suppressions by id in one call. Each id is gated
        exactly like the single delete (must belong to the caller's space; reason
        must be `manual` or `legal`). Requires an admin key. Supports
        `Idempotency-Key`. Always responds `200`.
      operationId: suppressions.batchDelete
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKeyParam' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SuppressionBatchDeleteRequest' }
      responses:
        '200':
          description: Per-item results and a summary.
          headers:
            Idempotent-Replay: { $ref: '#/components/headers/IdempotentReplay' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/SuppressionBatchDeleteResult' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /contacts/suppressions/{id}:
    parameters:
      - { $ref: '#/components/parameters/SuppressionIdParam' }
    get:
      tags: [Suppressions]
      summary: Get a suppression
      description: "Requires an admin key. Error: `suppression_not_found`."
