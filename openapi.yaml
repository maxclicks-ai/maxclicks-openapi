  /templates/{templateId}/send:
    parameters:
      - name: templateId
        in: path
        required: true
        description: The template id.
        schema: { type: string }
    post:
      tags: [Templates]
      summary: Send a template
      description: >-
        Requires Write permission and a stable Idempotency-Key. Renders stored template content
        and sends to the recipient resolved from data. Read expectedDataRepresentation and send
        every required key; referenced records are upserted before rendering and configured
        attribute expansions are applied. Available credits and email allowance are required.
        There is no subject/body replacement or preview execution parameter. A template without
        an email channel returns template_not_sendable.


        Pre-send validation and eligibility failures use request errors (email_limit_reached,
        sending_disabled, template_not_sendable, domain_not_verified, invalid_data,
        marketing_requires_contact, recipient_not_subscribed, recipient_suppressed). Records or
        preparation artifacts can exist before a later failure; an error does not prove that the
        request made no changes.


        HTTP 200 exposes emailId, status, and error. status=sent means the provider accepted the
        durable send attempt, not inbox delivery. A known terminal refusal or cancellation can
        return status=failed with a generic error. A temporary dispatch refusal returns
        429 template_send_retryable with Retry-After. Wait, then retry the same key, template and
        input. The retry reuses the saved message and recipient. An uncertain delivery or rendering
        result returns 409 template_send_outcome_unknown without a retry hint. Reconcile it; do not
        create a new key to force a second send. A confirmed permanent rejection stays failed on
        retry. Template sends do not return generic response-cache replay headers.
      operationId: templates.send
      parameters:
        - $ref: '#/components/parameters/TemplateSendIdempotencyKeyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TemplateSendRequest' }
            example:
              data:
                contact:
                  email: sarah@example.com
      responses:
        '200':
          description: The send was processed. Inspect data.status for the delivery result.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/TemplateSendResponse' }
                  warnings: { $ref: '#/components/schemas/Warnings' }
        '400':
          description: The request is invalid, including a missing or blank Idempotency-Key (template_send_operation_required).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >-
            template_send_operation_conflict means this key was already used with a different
            template or input. template_send_outcome_unknown means an existing rendering or
            delivery result needs reconciliation. Neither response authorizes a new send identity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '410':
          description: The send or its source data was erased (template_send_erased). The saved operation cannot be retried.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429':
          description: >-
            The API rate limit or dispatch capacity is temporarily unavailable. For
            template_send_retryable, the message can already be prepared. Wait for Retry-After,
            then retry the unchanged request with the same Idempotency-Key.
          headers:
            Retry-After:
              description: Delay before retrying. Dispatch waits use integer seconds; the API rate limiter can use an HTTP date.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503':
          description: >-
            The send is still processing (template_send_processing), preparation capacity is full
            (template_send_capacity_in_use), or the space is paused for maintenance. Retry later
            with the same identity and input. An uncertain provider result instead returns 409.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

